- id: manual-gear-knob
  title: "FIAT 500L gear shift.jpg"
  alt: "Gear knob of a six-speed manual gearbox, with the gear pattern printed on top."
  caption: "The pattern on top of the gear knob shows where each gear is. This six-speed car has 1, 3 and 5 forward, 2, 4 and 6 back, and **R** (reverse) to the right. Neutral is the middle position across the pattern."
