  modified: true

- id: studded-tyre
  title: "Studded snow tire 20171027.jpg"
  alt: "Close-up of a winter tyre with small metal studs in the tread."
  caption: "A **studded tyre** (*dubbdäck*): small metal studs stick out of the tread and grip on ice. In Sweden studded tyres are allowed from 1 October to 15 April, and at other times only when there is or may be winter road conditions."
  author: "Santeri Viinamäki"
  license: "CC BY-SA 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/4.0"
  page: "https://commons.wikimedia.org/wiki/File:Studded_snow_tire_20171027.jpg"
  w: 1000
  h: 751

- id: winter-tyre-symbol
  title: "3PSMF.jpg"
  alt: "Tyre sidewall with the M+S marking and the mountain-with-snowflake symbol."
  caption: "The **alpine symbol** – a mountain with three peaks and a snowflake (3PMSF) – shows an approved winter tyre. **M+S** (mud and snow) on its own does **not** make a tyre a winter tyre on a car in Sweden."
  author: "MatthewGhera"
  license: "CC BY 3.0"
  licenseUrl: "https://creativecommons.org/licenses/by/3.0"
  page: "https://commons.wikimedia.org/wiki/File:3PSMF.jpg"
  w: 1000
  h: 660

- id: oil-dipstick
  title: "Engine oil dipstick.JPG"
  alt: "A hand pulling the yellow oil dipstick out of a car engine."
  caption: "Checking the engine oil: pull out the **dipstick**, wipe it, push it fully back in, pull it out again and read the level between the **min** and **max** marks. Follow the car's handbook – usually the car should stand on level ground with the engine switched off."
  author: "Dvortygirl"
  license: "CC BY-SA 3.0"
  licenseUrl: "https://creativecommons.org/licenses/by-sa/3.0"
  page: "https://commons.wikimedia.org/wiki/File:Engine_oil_dipstick.JPG"
  w: 1000
  h: 750

