# Traffic-rules module questions, part A: basic duties, position, speed, right of way,
# turning, meeting and overtaking, pedestrians and cyclists, level crossings.

# ---------------------------------------------------------------- basic duties
- id: bd-care-special
  area: rules
  lesson: basic-duties
  q: Who does the law say you must show **special consideration** for?
  options:
    - Children, older people, school crossing patrols and people with a visible disability or illness
    - Only pedestrians at crossings
    - Drivers of emergency vehicles only
    - Cyclists on cycle tracks only
  answer: 0
  explain: The duty of care requires special consideration for **children, older people, school crossing patrols** and people who clearly have a **disability or illness** that hinders them in traffic.
  src: ["tf|2:1"]

- id: bd-white-cane
  area: rules
  lesson: basic-duties
  q: A person with a **white cane** is about to cross the street. What does the cane tell you?
  options: ["The person has impaired sight", "The person is a school crossing patrol", "The person has priority only at night", "The person is deaf"]
  answer: 0
  explain: A white cane shows that the person has **impaired sight**. Show special consideration and be ready to stop.
  src: ["tf|2:1"]

- id: bd-fit
  area: rules
  lesson: basic-duties
  q: You are below the alcohol limit but feel clearly affected after one drink. May you drive?
  options:
    - No – nobody may drive who cannot drive safely, whatever the limit
    - Yes – you are below the limit
    - Yes, if you drive slowly
    - Yes, if a passenger has a licence
  answer: 0
  explain: A vehicle may not be driven by anyone who – because of illness, tiredness, alcohol or other substances, or any other reason – **cannot drive safely**. This applies whatever the limits say.
  src: ["tf|3:1"]

- id: bd-distance
  area: rules
  lesson: basic-duties
  q: What does the law say about the distance to the vehicle in front?
  options:
    - It must be long enough to avoid running into it if it slows down or stops, and make overtaking easier for others
    - At least 3 seconds
    - At least 50 metres outside built-up areas
    - At least one car length per 10 km/h
  answer: 0
  explain: The law gives **no number**. The distance must be adapted so there is **no risk of running into** the vehicle in front if it slows down or stops, and so that others can **overtake** more easily. 3 seconds is only a rule of thumb.
  src: ["tf|3:2"]

- id: bd-emergency
  area: rules
  lesson: basic-duties
  q: An ambulance with siren and blue lights comes up behind you. What does the law require?
  options:
    - Make way for it – and stop if necessary
    - Speed up to the speed limit
    - Stop at once wherever you are
    - Nothing, if you are on a main road
  answer: 0
  explain: A road user must **make way** for an emergency vehicle using its siren and blue lights, and **stop if necessary**. Usually you move as far right as you safely can and slow down.
  src: ["tf|2:5"]

- id: bd-emergency-junction
  area: rules
  lesson: basic-duties
  q: You wait at a red light. A fire engine with siren and blue lights needs to get past you. What should you do?
  options:
    - Make room as well as you safely can without creating new danger – check the traffic around you
    - Drive straight out into the junction against red
    - Stay still – red always means stop
    - Turn off the engine
  answer: 0
  explain: You must make way and stop if necessary – but do what you **safely** can. A sudden move into a junction can cause a collision; the duty of care still applies.
  src: ["tf|2:5", "tf|2:1"]

- id: bd-column
  area: rules
  lesson: basic-duties
  q: A funeral procession is passing through a junction. May you drive into a gap in it?
  options: ["No", "Yes, if you have green", "Yes, if the gap is large", "Yes, if you sound the horn"]
  answer: 0
  explain: You may not break into or obstruct a **military column**, a **rescue service** column, a **group of children** led by an adult, a **funeral procession** or another procession.
  src: ["tf|2:6"]

- id: bd-signal-right
  area: rules
  lesson: basic-duties
  q: You indicate that you are going to change lanes. Does that give you the right to move over?
  options:
    - No – you must still make sure it can be done without danger or unnecessary obstruction
    - Yes – after three flashes
    - Yes, if you indicate in good time
    - Yes, on a motorway
  answer: 0
  explain: Signalling **does not give you the right** to go. You must still make sure the manoeuvre can be done without danger or unnecessary obstruction.
  src: ["tf|3:66", "tf|3:43"]

- id: bd-signal-when
  area: rules
  lesson: basic-duties
  q: When must you use the direction indicator?
  options:
    - When you start from the roadside, turn, turn around, change lanes or otherwise move sideways noticeably
    - Only when there are other vehicles around
    - Only when turning left
    - Only in built-up areas
  answer: 0
  explain: You must signal when you intend to **start from the roadside, turn around, turn, change lanes** or otherwise move sideways in a way that is not insignificant – in good time, clearly, and stop when the manoeuvre is done.
  src: ["tf|3:65"]

- id: bd-horn
  area: rules
  lesson: basic-duties
  q: When may you use the horn?
  options:
    - When needed to prevent danger – and no longer than necessary
    - To greet friends
    - To tell a slow driver to hurry up
    - Whenever you overtake
  answer: 0
  explain: The horn – and a flash of the headlights – may only be used when needed to **prevent danger**, and not longer than necessary.
  src: ["tf|3:64"]

- id: bd-object-road
  area: rules
  lesson: basic-duties
  q: Part of your load falls onto the road. What must you do?
  options:
    - Remove it at once – or, if you cannot, warn others until it is removed
    - Drive on and report it the next day
    - Nothing if it is small
    - Call a tow truck and drive on
  answer: 0
  explain: Whoever has caused something dangerous to be on the road must **remove it immediately**. If that is not possible, they must **warn others** – for example by marking it – until it has been removed.
  src: ["tf|2:10"]

- id: bd-sign-knocked
  area: rules
  lesson: basic-duties
  q: You accidentally knock over a road sign. What should you do?
  options:
    - Put it back, or tell the police or road authority at once
    - Leave it – it is the municipality's job
    - Take it with you
    - Put it anywhere at the roadside
  answer: 0
  explain: You may never move or change a road sign or other traffic device. If you have knocked one over, put it back or tell the **police or road authority** at once.
  src: ["tf|2:9"]

- id: bd-noise
  area: rules
  lesson: basic-duties
  q: Which of these is against the rules?
  options:
    - Letting the engine make more noise than necessary near homes
    - Driving at the speed limit at night
    - Using dipped beam in daylight
    - Stopping at a red light
  answer: 0
  explain: A motor vehicle may not make more **noise** or exhaust fumes than necessary, and you may not drive around needlessly near homes.
  src: ["tf|4:7", "tf|4:8"]

- id: bd-owner
  area: rules
  lesson: basic-duties
  exam: false
  q: A friend borrows your car in January and it has summer tyres in winter conditions. Who can be responsible?
  options: ["Also you, as the owner", "Only your friend", "Only the tyre shop", "Nobody"]
  answer: 0
  explain: The **owner** is responsible for making sure the vehicle is not used in breach of certain rules – for example winter tyres when required, or overloading – even when someone else drives it.
  src: ["tf|1:5"]

# ---------------------------------------------------------------- position on the road
- id: rp-keep-right
  area: rules
  lesson: road-position
  q: You drive on a road outside a built-up area with two lanes in your direction and a 100 km/h limit. Which lane should you normally use?
  options: ["The right-hand lane", "The left-hand lane", "Either lane", "The lane with less traffic"]
  answer: 0
  explain: The basic rule is to use the lane **furthest to the right** that is intended for your vehicle. The free choice of lane only applies on roads of **70 km/h or lower** with two marked lanes, or where lanes are signed for destinations.
  src: ["tf|3:7"]

- id: rp-free-lane
  area: rules
  lesson: road-position
  q: In town, a street has a 50 km/h limit and two marked lanes in your direction. Which lane may you use?
  options:
    - The lane most suitable for your onward journey
    - Only the right-hand lane
    - Only the left-hand lane
    - Only the lane with the least traffic
  answer: 0
  explain: On roads with a limit of **70 km/h or lower** and at least two marked lanes in your direction, you may use the lane that is **most suitable** for your onward journey.
  src: ["tf|3:7"]

- id: rp-weaving
  area: rules
  lesson: road-position
  q: On a 50 km/h street with two lanes in your direction, when may you change lanes?
  options:
    - Only to stop or park, to overtake, or to get into the right lane before a junction
    - Whenever the other lane moves faster
    - Never
    - Only in queues
  answer: 0
  explain: Where you may choose your lane freely, you may change lanes **only** to stop or park, to overtake, or to get into a suitable lane before turning.
  src: ["tf|3:9"]

- id: rp-queue
  area: rules
  lesson: road-position
  q: There are dense queues in **all** lanes in your direction. Who may change lanes?
  options:
    - Only the driver in the right-hand lane – others only to stop, park or get into the right lane for a junction
    - Everyone, if they indicate
    - Only the driver in the left-hand lane
    - Nobody
  answer: 0
  explain: In dense queues in all lanes, only the driver in the **rightmost** lane may change lanes. Others may only do so to stop or park, or to get into a suitable lane before a junction.
  src: ["tf|3:9"]

- id: rp-three-lanes
  area: rules
  lesson: road-position
  q: A two-way road has **three lanes** in total. Which lane may you not use?
  options: ["The leftmost lane", "The middle lane", "The rightmost lane", "You may use all three"]
  answer: 0
  explain: On a road with traffic in both directions and three lanes, you may not drive in the **leftmost** lane. With four or more lanes, you may not use the lanes left of the centre.
  src: ["tf|3:8"]

- id: rp-solid-lanes
  area: rules
  lesson: road-position
  q: Two lanes in the same direction are separated by a **solid** line. May you change lanes?
  options: ["No", "Yes, if you indicate", "Yes, if there is no traffic", "Yes, to overtake"]
  answer: 0
  explain: If a **solid line** separates lanes in the same direction, you may not change lanes.
  src: ["tf|3:9"]

- id: rp-reverse
  area: rules
  lesson: road-position
  q: When may you reverse?
  options:
    - Only when it can be done without danger or obstruction to others
    - Only in car parks
    - Never on public roads
    - Whenever you have your hazard lights on
  answer: 0
  explain: You may reverse or turn around only if it can be done **without danger or obstruction**. On motorways and expressways it is never allowed.
  src: ["tf|3:46", "tf|9:1"]

- id: rp-path
  area: rules
  lesson: road-position
  q: May you drive a car on a footpath to reach a parking space?
  options: ["No – you may only cross it", "Yes, at walking pace", "Yes, outside opening hours", "Yes, if no one is walking there"]
  answer: 0
  explain: A path meant for certain traffic – such as a footpath or cycle track – may only be **crossed** by other traffic.
  src: ["tf|3:6"]

# ---------------------------------------------------------------- speed
- id: sl-adapt
  area: rules
  lesson: speed-limits
  q: The limit is 90 km/h, but thick fog lets you see only 60 metres. How fast may you drive?
  options:
    - Only so fast that you can stop within the distance you can see
    - 90 km/h – the limit applies
    - 70 km/h – the base speed
    - 80 km/h if you use fog lights
  answer: 0
  explain: Your speed must always be adapted to the conditions, and never so high that you **cannot stop within the distance you can see**. The limit is a maximum, not a target.
  src: ["tf|3:14"]

- id: sl-builtup
  area: rules
  lesson: speed-limits
  q: What is the speed limit in a built-up area when no sign shows anything else?
  options: ["50 km/h", "30 km/h", "40 km/h", "60 km/h"]
  answer: 0
  explain: Within a built-up area the limit is **50 km/h**. The municipality can set 30 or 40 km/h with signs.
  src: ["tf|3:17"]

- id: sl-base
  area: rules
  lesson: speed-limits
  q: What is the **base speed** (*bashastighet*) outside built-up areas?
  options: ["70 km/h", "80 km/h", "90 km/h", "60 km/h"]
  answer: 0
  explain: Outside built-up areas the limit is **70 km/h** – the base speed – unless signs show something else.
  src: ["tf|3:17"]

- id: sl-motorway
  area: rules
  lesson: speed-limits
  q: What is the speed limit on a motorway when no sign shows anything else?
  options: ["110 km/h", "120 km/h", "100 km/h", "130 km/h"]
  answer: 0
  explain: On a motorway the limit is **110 km/h**. Trafikverket may set **120 km/h** with signs.
  src: ["tf|9:1"]

- id: sl-low-speed-situations
  area: rules
  lesson: speed-limits
  q: In which of these situations does the law specifically require a low enough speed?
  options:
    - When approaching a bus that has stopped to let passengers on or off
    - On a straight motorway in good weather
    - When overtaking
    - When driving downhill on a dry road
  answer: 0
  explain: The law lists situations needing low speed – among them approaching a **tram, bus or school bus** that has stopped for passengers, built-up areas, crossings, sharp bends, hill crests, dazzle, slippery roads, children and animals, road works and accidents.
  src: ["tf|3:15"]

- id: sl-splash
  area: rules
  lesson: speed-limits
  q: The road is full of puddles and slush, and pedestrians walk on the pavement. What must you do?
  options: ["Slow down so you do not splash them", "Keep the speed limit", "Sound the horn as a warning", "Drive in the middle of the road"]
  answer: 0
  explain: On **dirty roads** where others risk being splashed, the law requires a low enough speed.
  src: ["tf|3:15"]

- id: sl-too-slow
  area: rules
  lesson: speed-limits
  q: Is it allowed to drive unnecessarily slowly or brake suddenly without reason?
  options: ["No – not if it hinders others", "Yes, always", "Yes, below 30 km/h", "Only on motorways"]
  answer: 0
  explain: You may not drive **unnecessarily slowly** or brake suddenly without good reason in a way that hinders others.
  src: ["tf|3:16"]

- id: sl-trailer-braked
  area: rules
  lesson: speed-limits
  paths: [car-manual, car-automatic]
  q: You tow a trailer with a total weight of 1,200 kg that has an **overrun brake**, on a road with a 100 km/h limit. What is your maximum speed?
  options: ["80 km/h", "100 km/h", "90 km/h", "70 km/h"]
  answer: 0
  explain: A car with a braked trailer (for example with an overrun brake and rigid drawbar, at most 3.5 tonnes) may go at most **80 km/h** – even where the road limit is higher.
  src: ["tf|4:20"]

- id: sl-towing-rope
  area: rules
  lesson: speed-limits
  paths: [car-manual, car-automatic]
  q: You tow a broken-down car with a tow rope. What is the maximum speed?
  options: ["30 km/h", "40 km/h", "50 km/h", "70 km/h"]
  answer: 0
  explain: Towing another vehicle with a rope or tow bar – and other cases not listed elsewhere – means at most **30 km/h**.
  src: ["tf|4:20"]

- id: sl-mc-trailer
  area: rules
  lesson: speed-limits
  paths: [motorcycle]
  q: What is the maximum speed for a motorcycle with a trailer?
  options: ["80 km/h", "70 km/h", "90 km/h", "The road's speed limit"]
  answer: 0
  explain: A **motorcycle with a trailer** may go at most **80 km/h**.
  src: ["tf|4:20"]

- id: sl-mc-trailer-rules
  area: rules
  lesson: speed-limits
  paths: [motorcycle]
  q: Which trailer may a two-wheeled motorcycle tow?
  options:
    - One at most 125 cm wide, weighing at most half the motorcycle's kerb weight – and never with passengers in it
    - Any light trailer up to 750 kg
    - Any trailer if the motorcycle has more than 50 kW
    - Motorcycles may never tow trailers
  answer: 0
  explain: A two-wheeled motorcycle may tow a trailer of at most **125 cm** width that weighs at most **half the motorcycle's kerb weight**. Passengers may never ride in it.
  src: ["tf|4:15a", "tf|4:15b"]

- id: sl-pedestrian-street
  area: rules
  lesson: speed-limits
  q: What is the highest speed on a pedestrian street?
  options: ["Walking pace", "20 km/h", "30 km/h", "10 km/h"]
  answer: 0
  explain: On a pedestrian street and in a walking-speed area, vehicles may go at most **walking pace**.
  src: ["tf|8:1"]

# ---------------------------------------------------------------- right of way
- id: rw-right-hand
  area: rules
  lesson: right-of-way
  q: You come to a junction **without signs or signals**. A car approaches from your right. Who goes first?
  options: ["The car from the right", "You", "Whoever is faster", "Whoever is on the wider road"]
  answer: 0
  explain: When two vehicles' paths cross, a driver must give way to the vehicle **approaching from the right** – the **right-hand rule**.
  src: ["tf|3:18"]

- id: rw-right-hand-bike
  area: rules
  lesson: right-of-way
  q: At a junction without signs, a **cyclist** comes from your right on the carriageway. Who goes first?
  options: ["The cyclist", "You – cars have priority", "Whoever arrives first", "You, if you are turning right"]
  answer: 0
  explain: A bicycle is a vehicle too. In an unsigned junction, the **right-hand rule** applies to cyclists as well.
  src: ["tf|3:18"]

- id: rw-from-left
  area: rules
  lesson: right-of-way
  q: At a junction without signs you have a car on your left. Its driver does not seem to slow down. What do you do?
  options:
    - Be ready to stop – having priority never means you may ignore the risk
    - Keep going – you have priority
    - Sound the horn and accelerate
    - Flash your headlights and keep going
  answer: 0
  explain: "The car on your left must give way to you, but the **duty of care** still applies: if the other driver does not give way, you must do what you can to avoid a collision."
  src: ["tf|3:18", "tf|2:1"]

- id: rw-car-park
  area: rules
  lesson: right-of-way
  q: You drive out of a car park onto a street. A car comes from your **left**. Who goes first?
  options:
    - The car on the street – you give way to everyone when leaving a car park
    - You – the car comes from the left
    - Whoever is faster
    - You, if you indicate
  answer: 0
  explain: When you come onto a road from a **car park, property, petrol station** or similar, you must give way to **every vehicle** whose path crosses yours – the right-hand rule does not apply.
  src: ["tf|3:21"]

- id: rw-across-pavement
  area: rules
  lesson: right-of-way
  q: You drive out of a driveway, across a pavement, onto the street. Who must you give way to?
  options:
    - Pedestrians on the pavement and all vehicles on the street
    - Only vehicles from the right
    - Only vehicles from the left
    - Nobody – the driveway is yours
  answer: 0
  explain: Driving out from a **property** across a footpath, you give way to **pedestrians** on it and to **all vehicles** on the road.
  src: ["tf|3:21", "tf|3:58"]

- id: rw-order
  area: rules
  lesson: right-of-way
  q: In which order do these decide who goes first at a junction?
  options:
    - Police officer → traffic lights → signs and markings → general rules
    - Signs → police officer → traffic lights → general rules
    - Traffic lights → police officer → general rules → signs
    - General rules → signs → traffic lights → police officer
  answer: 0
  explain: A **police officer** overrides everything; a working **traffic light** overrides give-way and stop signs; **signs and markings** override the **general rules** such as the right-hand rule.
  src: ["tf|2:3", "tf|2:2"]

- id: rw-turn-left
  area: rules
  lesson: right-of-way
  q: You turn left at a junction. An oncoming car is going straight on. Who goes first?
  options: ["The oncoming car", "You", "Whoever indicates first", "Whoever comes from the right"]
  answer: 0
  explain: A driver turning at a junction must make sure it can be done **without obstructing oncoming traffic** – so the oncoming car goes first.
  src: ["tf|3:24"]

- id: rw-four-way
  area: rules
  lesson: right-of-way
  q: Four cars arrive at the same time at an unsigned crossroads, one from each direction. What happens?
  options:
    - Nobody can go by the right-hand rule alone – the drivers must agree carefully
    - The car going straight on goes first
    - The biggest vehicle goes first
    - The car from the north goes first
  answer: 0
  explain: Everyone has a car on their right, so the **right-hand rule** cannot decide. The drivers must **agree** – carefully, with eye contact and clear signals.
  src: ["tf|3:18", "tf|2:1"]

- id: rw-tram
  area: rules
  lesson: right-of-way
  q: A tram approaches a junction where no sign gives the tram driver a duty to give way. What do you do?
  options: ["Give the tram free way", "The tram must give way to you if you come from the right", "Sound the horn", "Drive first if you are faster"]
  answer: 0
  explain: You must give **free way** to trains and trams – unless a road sign gives the tram driver a duty to give way.
  src: ["tf|2:5"]

- id: rw-block-junction
  area: rules
  lesson: right-of-way
  q: The queue ahead continues through the junction. When may you drive into the junction?
  options:
    - When there is room for your whole vehicle on the other side
    - Whenever you have green
    - When the car in front starts moving
    - Never in a queue
  answer: 0
  explain: Drive so that you **will not block** crossing traffic if you have to stop. Wait before the junction until there is room on the other side.
  src: ["tf|3:20"]

- id: rw-bus-stop-island
  area: rules
  lesson: right-of-way
  q: A bus has stopped at a stop **without a traffic island**, and passengers are getting off. You pass on its right side (for example a tram in the middle of the street). What must you do?
  options: ["Stop and let the passengers get on and off", "Drive past slowly", "Sound the horn", "Pass on the left instead"]
  answer: 0
  explain: When you pass a tram or bus stopped at a stop **without a traffic island**, on its right side, you must **stop** and let passengers get on and off.
  src: ["tf|3:58"]

- id: rw-pedestrians-meet
  area: rules
  lesson: right-of-way
  q: You meet pedestrians walking on a narrow road without a footpath. What must you do?
  options: ["Give them enough room and time to step aside", "Sound the horn so they move", "Keep your speed – they must move", "Flash your lights"]
  answer: 0
  explain: When you **meet or overtake** pedestrians, you must give them enough **room and time** to step aside.
  src: ["tf|3:58"]

# ---------------------------------------------------------------- turning and lanes
- id: tl-left-lane
  area: rules
  lesson: turning-and-lanes
  q: The road before a junction has two lanes in your direction. You will turn left. Which lane do you use?
  options: ["The leftmost lane", "The rightmost lane", "Either lane", "The lane with the shortest queue"]
  answer: 0
  explain: To turn **left**, place the vehicle in good time in the **leftmost** lane; to turn right, in the rightmost lane.
  src: ["tf|3:25"]

- id: tl-right-turn-position
  area: rules
  lesson: turning-and-lanes
  q: How do you position the car when you turn right at a junction?
  options:
    - As close to the right edge of the carriageway as is suitable
    - In the middle of the road
    - Close to the centre line
    - It does not matter
  answer: 0
  explain: When turning right, keep as close to the **right edge** as is suitable – then a cyclist cannot end up on your right.
  src: ["tf|3:26"]

- id: tl-left-turn-position
  area: rules
  lesson: turning-and-lanes
  q: On a two-way road, where should you be when you turn left?
  options:
    - As close to the centre of the carriageway as possible
    - Close to the right edge
    - In the oncoming lane
    - Anywhere, if you indicate
  answer: 0
  explain: When turning left on a two-way road, keep as close to the **centre** as possible – on a one-way road, close to the left edge – and end up on the right side of the road you turn into.
  src: ["tf|3:26"]

- id: tl-look-back
  area: rules
  lesson: turning-and-lanes
  q: Before you turn right, what does the law say you must pay special attention to?
  options: ["The traffic behind you – for example cyclists on your right", "The traffic signals only", "The traffic on your left", "Pedestrians on the other side of the road"]
  answer: 0
  explain: A driver may turn only without danger or unnecessary obstruction to others going the same way, and **special attention** must be paid to the **traffic behind**.
  src: ["tf|3:26"]

- id: tl-cyclist-left
  area: rules
  lesson: turning-and-lanes
  q: A cyclist is on your right before a junction. You will turn right. Which is true?
  options:
    - The cyclist may be going straight on – or even left – so check the mirror and blind spot
    - A cyclist on the right always turns right
    - The cyclist must give way to you
    - Cyclists must always wait behind cars
  answer: 0
  explain: Cyclists may keep to the **right** before a junction even when going **left** – they cross to the far side and turn there. Check your mirror and **blind spot** before turning right.
  src: ["tf|3:28"]

- id: tl-two-left
  area: rules
  lesson: turning-and-lanes
  q: You and an oncoming car both turn left at a junction. How do you pass each other?
  options:
    - Left side to left side – in front of each other – if it can be done safely
    - Right side to right side – behind each other
    - One must wait until the other has turned
    - It is forbidden for both to turn left at the same time
  answer: 0
