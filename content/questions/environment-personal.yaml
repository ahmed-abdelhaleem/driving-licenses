# ---------------------------------------------------------------- consequences
- id: pf-two-consequences
  area: personal
  lesson: consequences
  q: You are caught speeding by 35 km/h. Which two things can follow?
  options:
    - A fine and a decision on your licence from Transportstyrelsen
    - Only a fine
    - Only a licence decision
    - Only a letter of warning from the police
  answer: 0
  explain: A penalty (fine) and a **licence decision** (revocation or warning) are two separate consequences. Speeding 31–40 km/h over the limit normally means **2 months** without a licence.
