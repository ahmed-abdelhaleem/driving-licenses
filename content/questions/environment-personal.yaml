# ---------------------------------------------------------------- alcohol and drugs
- id: pf-limit
  area: personal
  lesson: alcohol-and-drugs
  q: From what blood alcohol level is it drink-driving (*rattfylleri*)?
  options: ["0.2 per mille", "0.5 per mille", "0.8 per mille", "1.0 per mille"]
  answer: 0
  explain: Drink-driving starts at **0.2 per mille** in the blood or **0.10 mg/l** in the breath – during or after driving.
  src: ["tbl|4"]

- id: pf-gross
  area: personal
  lesson: alcohol-and-drugs
  q: From what blood alcohol level is drink-driving normally judged as **aggravated** (*grovt rattfylleri*)?
  options: ["1.0 per mille", "0.5 per mille", "0.2 per mille", "2.0 per mille"]
  answer: 0
  explain: It is judged especially as aggravated with at least **1.0 per mille** in the blood (0.50 mg/l breath), when the driver is considerably affected, or when the driving was an obvious danger to traffic safety. Up to two years in prison.
  src: ["tbl|4a"]

- id: pf-penalty
  area: personal
  lesson: alcohol-and-drugs
  q: What is the penalty for drink-driving (not aggravated)?
  options: ["Fines or prison for up to six months", "Only a warning", "Prison for at least two years", "Only a fine"]
  answer: 0
  explain: Drink-driving gives **fines or prison for up to six months**. Aggravated drink-driving gives prison for up to two years.
  src: ["tbl|4", "tbl|4a"]

- id: pf-after
  area: personal
  lesson: alcohol-and-drugs
  q: Your breath test is taken an hour **after** you stopped driving and shows 0.12 mg/l. Does it count?
  options: ["Yes – the level during or after the journey counts", "No – only the level while driving counts", "Only if you admit it", "Only on motorways"]
  answer: 0
  explain: The law says the alcohol concentration **during or after** the journey counts. 0.12 mg/l is above the 0.10 mg/l breath limit.
