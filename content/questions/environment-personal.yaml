  q: What is the usual waiting period after speeding by 31–40 km/h over the limit?
  options: ["2 months", "1 week", "1 year", "No waiting period"]
  answer: 0
  explain: The most common revocation case is speeding by **31–40 km/h** – normally a **2-month** waiting period. More serious speeding gives a longer period.
  src: [ts-revocation]

- id: pf-speed-30-zone
