    - Drive in a low gear with high revs
    - Change gear as late as possible
    - Drive in neutral downhill
  answer: 0
  explain: Trafikverket's eco-driving steps include **changing up early** and driving in as **high a gear as possible**.
  src: [em-eco]

- id: env-automatic
  area: environment
  lesson: eco-driving
  paths: [car-automatic]
  q: How do you drive an automatic car economically?
  options:
    - Press the accelerator gently so the gearbox changes up early, and release it early before you stop
    - Use kick-down often
    - Always use the lowest drive range
    - Drive with the left foot on the brake
  answer: 0
  explain: A gentle accelerator lets the gearbox **change up early**. Plan ahead, keep an even speed and use engine braking – Trafikverket's eco-driving steps.
  src: [em-eco]

- id: env-plan
  area: environment
  lesson: eco-driving
  q: The traffic light far ahead turns red. What is the most economical way to drive?
  options:
    - Release the accelerator early and let the vehicle roll in gear
    - Keep your speed and brake hard at the light
    - Speed up to get through
    - Change to neutral and coast
  answer: 0
  explain: "Plan ahead to **avoid stopping**, and use **engine braking**: release the accelerator early. Energy you brake away is lost as heat."
  src: [em-eco]

- id: env-idle
  area: environment
  lesson: eco-driving
  q: Many municipalities have local rules on idling. What does Karlskoga's rule say about a stationary vehicle's engine?
  options:
