    - It does not change
    - It falls, because you reach your goal sooner
    - It rises only for diesel cars
  answer: 0
  explain: For every **10 km/h** above about 70–75 km/h, consumption rises by **0.5–1.0 dl per Swedish mile** (10 km). Air resistance grows quickly with speed.
  src: [ts-eco]

- id: env-saving
  area: environment
  lesson: eco-driving
  q: According to Trafikverket, about how much fuel does eco-driving save on average?
  options: ["About 7 %", "About 50 %", "About 1 %", "Nothing"]
  answer: 0
  explain: Eco-driving saves on average about **7 %** of the fuel – typically 4–10 %, sometimes more.
  src: [em-eco]

- id: env-gear
  area: environment
  lesson: eco-driving
  paths: [car-manual, motorcycle]
  q: Which gear technique saves fuel?
  options:
