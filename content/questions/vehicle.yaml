# Vehicle knowledge questions (area: vehicle) – tyres, brakes, skids, safety systems,
# electric cars, the manual gearbox, and the motorcycle's brakes, helmet and gear.

# ---------------------------------------------------------------- tyres (cars)
- id: ty-tread-summer
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: What is the minimum tread depth for car tyres in summer conditions?
  options: ["1.6 mm", "3 mm", "1 mm", "4 mm"]
  answer: 0
  explain: The main tread pattern may not be worn below **1.6 mm** in the middle 75 % of the tread width. Grip on wet roads gets much worse long before that.
  src: ["tsfs-2009-19|4"]

- id: ty-tread-winter
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: What is the minimum tread depth on winter tyres from 1 December to 31 March when there are winter road conditions?
  options: ["3 mm", "1.6 mm", "5 mm", "2 mm"]
  answer: 0
  explain: When winter tyres are required, they must have at least **3 mm** of tread.
  src: ["tsfs-2009-19|5", ts-winter-tyres]

- id: ty-winter-when
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: When must a car have winter tyres (or equivalent equipment)?
  options:
    - From 1 December to 31 March, when there are winter road conditions
    - From 1 October to 15 April, always
    - Whenever the temperature is below 0 °C
    - From 1 November to 31 March, always
  answer: 0
  explain: Cars, light trucks, light buses and trailers they tow must have winter tyres or equivalent equipment **1 December – 31 March** when **winter road conditions** apply.
  src: ["tf|4:18a"]

- id: ty-winter-conditions
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: What counts as **winter road conditions** (*vinterväglag*)?
  options:
    - Snow, ice, slush or frost on any part of the road
    - Snow covering the whole road
    - Temperatures below −5 °C
    - Only ice on bridges
  answer: 0
  explain: Winter road conditions means **snow, ice, slush or frost on any part** of the road.
  src: ["tsfs-2009-19|3", ts-winter-tyres]

- id: ty-who-decides
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: Who decides whether winter road conditions apply at a certain place?
  options: ["The police", "The driver", "The municipality", "Trafikverket's weather service"]
  answer: 0
  explain: Transportstyrelsen says the **police** decide whether winter road conditions apply at a given place.
  src: [ts-winter-tyres]

- id: ty-ms
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: A car tyre is marked only **M+S**. Does it count as a winter tyre?
  options:
    - No – it needs the alpine symbol (3PMSF), the POR marking or studs
    - Yes – M+S means winter tyre
    - Yes, if the tread is at least 3 mm
    - Only on the rear axle
  answer: 0
  explain: A winter tyre for a car must have the **alpine symbol** (mountain with three peaks and a snowflake), be marked **POR**, or be **studded**. M+S alone is not enough.
  src: ["tsfs-2009-19|3", ts-winter-tyres]

- id: ty-chains
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: What can count as "equivalent equipment" instead of winter tyres?
  options: ["Snow chains", "Wider summer tyres", "Lower tyre pressure", "Sand in the boot"]
  answer: 0
  explain: The rules allow winter tyres **or equivalent equipment** – for example **snow chains**.
  src: ["tsfs-2009-19|3"]

- id: ty-studs-period
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: When may you drive with studded tyres?
  options:
    - 1 October to 15 April – and outside that period only if there are, or may be, winter road conditions
    - All year
    - Only 1 December to 31 March
    - Only when there is ice on the road
  answer: 0
  explain: Studded tyres are allowed **1 October – 15 April**, and outside that period only when there are – or may be – winter road conditions.
  src: ["tsfs-2009-19|8", ts-winter-tyres]

- id: ty-mix
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: You have studded tyres only on the front wheels and non-studded winter tyres at the back. Is that allowed?
  options: ["No – a car may not have studded and non-studded tyres at the same time", "Yes", "Yes, on front-wheel-drive cars", "Yes, if all have 3 mm tread"]
  answer: 0
  explain: A car may **not** use studded and non-studded tyres at the same time.
  src: ["tsfs-2009-19|10"]

- id: ty-trailer-studs
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: Your car has studded tyres and there are winter road conditions. What applies to the trailer you tow?
  options: ["It must also have studded tyres", "It may have summer tyres", "It needs snow chains", "Nothing"]
  answer: 0
  explain: If the car has studded tyres and there are winter road conditions, a trailer it tows must **also have studded tyres**.
  src: ["tsfs-2009-19|11"]

- id: ty-best-rear
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: Where should you fit the two tyres with the deepest tread?
  options: ["On the rear axle – also on a front-wheel-drive car", "On the front axle", "On the driving wheels", "It does not matter"]
  answer: 0
  explain: Transportstyrelsen advises fitting the tyres with the **best grip on the rear axle** – also on front-wheel-drive cars – to reduce the risk of skidding when braking and in bends.
  src: [ts-tyres]

- id: ty-pressure
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: How should you check the tyre pressure?
  options:
    - When the tyres are cold, against the values in the owner's manual
    - After a long drive, when the tyres are warm
    - By looking at the tyres
    - Only when a warning light comes on
  answer: 0
  explain: Find the right pressure in the **owner's manual** and check it when the tyres are **cold**. Wrong pressure affects handling, fuel consumption and the life of the tyre.
  src: [ts-tyres]

- id: ty-pressure-effect
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: What can wrong tyre pressure affect?
  options: ["Handling, fuel consumption and the life of the tyre", "Only comfort", "Only the tyre's colour", "Nothing, on modern cars"]
  answer: 0
  explain: Wrong tyre pressure affects the car's **handling**, its **fuel consumption** and the **life** of the tyre.
  src: [ts-tyres]

- id: ty-damage
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  q: A tyre has a cut that shows the inner reinforcement. May you drive on it?
  options: ["No", "Yes, if the tread is deep enough", "Yes, in summer", "Yes, on the rear axle"]
  answer: 0
  explain: A tyre may not have cracks, holes or other damage that exposes its **inner reinforcement**.
  src: ["tsfs-2009-19|6"]

- id: ty-old-car
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  exam: false
  q: Which cars are exempt from the winter tyre requirement?
  options: ["Cars that are 30 years old or more", "Electric cars", "Four-wheel-drive cars", "Cars with ABS"]
  answer: 0
  explain: The requirement does not apply to vehicles that are **30 years old or more** (by model year).
  src: ["tf|4:18c"]

- id: ty-store
  area: vehicle
  lesson: tyres
  paths: [car-manual, car-automatic]
  exam: false
  q: How should you store tyres between seasons?
  options: ["Cool, dry and dark", "Warm and sunny", "Outside in the rain", "Next to the heater"]
  answer: 0
  explain: Transportstyrelsen advises storing tyres **cool, dry and dark**.
  src: [ts-tyres]

# ---------------------------------------------------------------- brakes and ABS (cars)
- id: br-abs-steer
  area: vehicle
  lesson: brakes-and-abs
  paths: [car-manual, car-automatic]
  q: In an emergency in a car with ABS, how do you brake?
  options:
    - Press the brake pedal firmly and keep the pressure – ABS should let you keep steering control
    - Pump the pedal quickly
    - Brake gently to avoid activating the ABS
    - Pull the parking brake
  answer: 0
  explain: With ABS, apply the footbrake **firmly** and do not release the pressure. ABS should ensure that **steering control is retained**. A pulsing pedal is normal.
  src: ["uk-hc-general|rule 120"]

- id: br-abs-distance
  area: vehicle
  lesson: brakes-and-abs
  paths: [car-manual, car-automatic]
  q: Does ABS always give a shorter stopping distance?
  options:
    - No – its main benefit is that you can steer while braking hard
    - Yes, on all surfaces
    - Yes, on ice
    - Yes, if the tyres are new
  answer: 0
  explain: Do **not** assume that a vehicle with ABS will stop in a shorter distance. ABS keeps the wheels from locking so that you **keep steering control**.
  src: ["uk-hc-general|rule 120"]

- id: br-lock
  area: vehicle
  lesson: brakes-and-abs
  paths: [car-manual, car-automatic]
  q: Why should you avoid braking so hard that the wheels lock (in a car without ABS)?
  options:
    - Locked wheels can lead to loss of control – the car cannot be steered
    - It wears the brake pads
    - It is forbidden
    - It turns off the engine
  answer: 0
  explain: In an emergency, brake immediately, but try not to brake so harshly that you lock the wheels – **locked wheels can lead to loss of control**.
  src: ["uk-hc-general|rule 118"]

- id: br-wet
  area: vehicle
  lesson: brakes-and-abs
  paths: [car-manual, car-automatic]
  q: You have just driven through deep water. What should you do?
  options:
    - Test the brakes gently at the first safe opportunity – they may be less effective
    - Brake hard at once to dry them
    - Nothing – brakes are not affected by water
    - Pull the parking brake while driving
  answer: 0
  explain: After deep water the brakes may be **less effective**. Test them gently when it is safe; if they are weak, apply light pressure while driving slowly to dry them.
  src: ["uk-hc-general|rule 121"]

- id: br-aeb
  area: vehicle
  lesson: brakes-and-abs
  paths: [car-manual, car-automatic]
  q: According to Trafikverket's research summary, roughly how much did collision warning plus automatic emergency braking reduce rear-end collisions with injuries?
  options: ["By about half", "By about 5 %", "By about 90 %", "Not at all"]
  answer: 0
  explain: Several studies show that **FCW + AEB** reduced injury rear-end collisions by about **53–56 %** – roughly half. But the systems cannot see everything; you are still the driver.
  src: [tv-vehicle-safety]

# ---------------------------------------------------------------- grip and skids (cars)
- id: sk-cause
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: What usually causes a skid?
  options:
    - Braking, accelerating or steering too harshly, or driving too fast for the conditions
    - Driving in too high a gear
    - Driving with dipped beam
    - Having the windows open
  answer: 0
  explain: Skidding is usually caused by the driver **braking, accelerating or steering too harshly** or driving **too fast** for the road conditions.
  src: ["uk-hc-general|rule 119"]

- id: sk-recover
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: The rear of your car starts to skid to the **right**. What do you do?
  options:
    - Release the brake or ease off the accelerator, and steer to the right
    - Brake hard and steer to the left
    - Accelerate hard
    - Pull the parking brake
  answer: 0
  explain: "Remove the cause – release the brake fully or ease off the accelerator – and **steer in the direction of the skid**: if the rear skids to the right, steer right."
  src: ["uk-hc-general|rule 119"]

- id: sk-aquaplane
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: In heavy rain the steering suddenly feels light and unresponsive. What is happening, and what do you do?
  options:
    - Water is stopping the tyres from gripping – ease off the accelerator and slow down gradually
    - The power steering has failed – brake hard
    - The tyres are too hard – speed up
    - Nothing – it is normal in rain
  answer: 0
  explain: Unresponsive steering in the wet probably means **water is preventing the tyres from gripping** (aquaplaning). **Ease off the accelerator** and slow down gradually – no hard braking or sharp steering.
  src: ["uk-hc-weather|rule 227"]

- id: sk-wet-distance
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: How much longer are stopping distances on a wet road compared with a dry road?
  options: ["At least double", "About 10 % longer", "The same with ABS", "Half as long"]
  answer: 0
  explain: In wet weather, stopping distances will be **at least double** those on dry roads, because the tyres have less grip.
  src: ["uk-hc-weather|rule 227"]

- id: sk-ice-distance
  area: vehicle
  lesson: skids-and-traction
  q: On icy roads, how much longer can stopping distances be than on dry roads?
  options: ["Up to ten times longer", "About twice as long", "About 20 % longer", "The same with winter tyres"]
  answer: 0
  explain: In icy and snowy weather, stopping distances can be **ten times greater** than on dry roads. Keep well back from the road user in front.
  src: ["uk-hc-weather|rule 230"]

- id: sk-ice-technique
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: How should you drive on an icy road?
  options:
    - At a slow speed in as high a gear as possible, accelerating and braking very gently
    - In a low gear with high engine speed
    - At normal speed if you have ABS
    - With sharp steering movements to keep control
  answer: 0
  explain: On ice, avoid sudden actions. Drive **slowly in as high a gear as possible**, accelerate and brake **very gently**, and brake on the straight **before** bends.
  src: ["uk-hc-weather|rule 231"]

- id: sk-ice-noise
  area: vehicle
  lesson: skids-and-traction
  q: Which sign can tell you that you are driving on ice?
  options:
    - The tyres become almost silent and the steering feels light
    - The tyres get louder
    - The engine speed drops
    - The car pulls to the left
  answer: 0
  explain: Unresponsive steering may indicate ice, and **on ice the tyres make virtually no noise**. Check the grip by braking gently at a safe place.
  src: ["uk-hc-weather|rule 231"]

- id: sk-test-grip
  area: vehicle
  lesson: skids-and-traction
  q: How can you check the grip when there is snow or ice?
  options:
    - Brake gently at a safe place with no traffic behind you
    - Brake hard in a bend
    - Accelerate hard from standstill at a junction
    - Turn the steering wheel sharply at speed
  answer: 0
  explain: Check your grip on snow or ice by **choosing a safe place to brake gently**.
  src: ["uk-hc-weather|rule 231"]

- id: sk-esc
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: According to Trafikverket's research summary, roughly how much did ESC (anti-skid) reduce single-vehicle, head-on and overtaking crashes with injuries?
  options: ["About 31 %", "About 3 %", "About 90 %", "It had no effect"]
  answer: 0
  explain: ESC reduced such injury crashes by about **31 %** – about 41 % where someone was killed or seriously injured – and the effect was largest on **wet roads (56 %)**.
  src: [tv-vehicle-safety]

- id: sk-esc-limits
  area: vehicle
  lesson: skids-and-traction
  paths: [car-manual, car-automatic]
  q: Your car has ESC. Which is true?
  options:
    - It helps, but if you drive too fast for the grip you can still leave the road
    - It lets you take bends at any speed
    - It replaces winter tyres
    - It makes the braking distance on ice normal
  answer: 0
  explain: ESC can reduce the risk of skidding, but it cannot change physics. The law still requires a speed at which you keep **control** of the vehicle.
  src: [tv-vehicle-safety, "tf|3:14"]

