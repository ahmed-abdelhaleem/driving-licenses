    - No – helmets are very strong
    - Only paint is a problem
    - Only if the helmet is new
  answer: 0
  explain: A helmet may not be used if something has been done to it that can reduce its protection – Transportstyrelsen gives **stickers, protruding objects, holes in the shell and paint** as examples.
  src: ["tsfs-2017-94|6"]

- id: mcv-helmet-fastened
  area: vehicle
  lesson: mc-protective-gear
  paths: [motorcycle]
  q: How must the helmet be worn?
  options: ["Securely fastened so it sits firmly on the head", "With the strap loose for comfort", "Pushed back so you see more", "Only fastened outside built-up areas"]
  answer: 0
  explain: The helmet must be **securely fastened** so that it sits firmly on the head.
  src: ["tsfs-2017-94|5"]

- id: mcv-visor
  area: vehicle
  lesson: mc-protective-gear
  paths: [motorcycle]
  q: Why should you replace a badly scratched visor?
  options:
    - Scratches limit your view, especially in bright sunshine and in darkness
    - It is only a cosmetic problem
    - It is required every year
    - It makes the helmet heavier
  answer: 0
  explain: Scratched or poorly fitting eye protection can **limit your view**, particularly in **bright sunshine and in darkness**. Check your visor before each ride.
  src: ["uk-hc-mc|rule 84"]

- id: mcv-be-seen
  area: vehicle
  lesson: mc-protective-gear
  paths: [motorcycle]
  q: You wear a bright helmet, fluorescent clothing and ride with the headlight on. Can you be sure drivers have seen you?
