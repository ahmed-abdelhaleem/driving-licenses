  lesson: mc-protective-gear
  paths: [motorcycle]
  q: Which helmet may you use on a motorcycle?
  options:
    - One that is E-marked and type-approved under ECE Regulation 22, series 05 or later
    - Any helmet that covers the head
    - A bicycle helmet, if you ride slowly
    - Any helmet bought in the EU
  answer: 0
  explain: The helmet must be **E-marked** and type-approved under **UN ECE Regulation 22, amendment series 05 or later** (22.05 or 22.06).
  src: ["tsfs-2017-94|3"]

- id: mcv-helmet-stickers
  area: vehicle
  lesson: mc-protective-gear
  paths: [motorcycle]
  q: You want to paint your helmet and drill holes for a camera mount. Is that a problem?
