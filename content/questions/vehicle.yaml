  options: ["About 45 %", "About 5 %", "About 15 %", "About 95 %"]
  answer: 0
  explain: The seat belt reduced deaths among front-seat occupants by about **45 %** in all types of car crashes.
  src: [tv-vehicle-safety]

- id: ss-belt-airbag
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: Why should you always wear the seat belt even in a car with airbags?
  options:
    - The airbag is made to work together with the belt – together they cut deaths in frontal crashes far more
    - Airbags only work at low speed
    - The belt switches the airbag on
    - It is only a recommendation
  answer: 0
  explain: Belt and driver airbag **together** reduced driver deaths in frontal crashes by about **61 %**, compared with about 29 % for the airbag alone. Using the belt is also the law.
  src: [tv-vehicle-safety, "tf|4:10"]

- id: ss-reminder
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: What happens to seat belt use in the front seats of cars with an effective seat belt reminder?
  options: ["It rises to about 99 %", "It falls", "It stays at about 50 %", "It does not change"]
  answer: 0
  explain: Studies cited by Trafikverket found belt use in the front seats of about **99 %** in cars with an effective seat belt reminder.
  src: [tv-vehicle-safety]

- id: ss-airbag-child
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: From about what height is a child safe sitting in front of an active passenger airbag?
  options: ["About 140 cm", "About 100 cm", "About 120 cm", "Never, at any height"]
  answer: 0
  explain: A child is not safe in front of an active airbag until about **140 cm** tall. Never put a child seat or booster in front of an active airbag.
  src: [ts-children]

- id: ss-side-airbag
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: Are **side airbags** a danger to a child in a child seat?
  options: ["No", "Yes – they must be switched off", "Yes, for rear-facing seats", "Only in winter"]
  answer: 0
  explain: Transportstyrelsen says **side airbags** and curtains are **no danger** to children in child seats. The danger is an active **front** passenger airbag.
  src: [ts-children]

- id: ss-ldw
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: What does a **lane departure warning** (LDW) do?
  options:
    - Warns you when the car is about to leave its lane – generally from about 65 km/h
    - Steers the car back by itself at any speed
    - Brakes the car automatically in a queue
    - Shows the speed limit
  answer: 0
  explain: LDW **warns** when the car is about to leave its lane, generally from about **65 km/h**. In Swedish data it reduced injuries in head-on and single-vehicle crashes by about 40 %.
  src: [tv-vehicle-safety]

- id: ss-isa
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: What is **ISA** (intelligent speed assistance)?
  options:
    - A system that informs you about the speed limit and helps you keep within it – standard in new EU cars from 2024
    - A system that brakes for pedestrians
    - A cruise control that ignores speed limits
    - An anti-skid system
  answer: 0
  explain: ISA informs the driver about the current **speed limit** and supports keeping within it. It is **standard equipment in all new cars in the EU from 2024**.
  src: [tv-vehicle-safety]

- id: ss-assist-limits
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: Your car has lane keeping assist and automatic emergency braking. Who is responsible for driving it?
  options: ["You – the systems only work in certain conditions", "The car manufacturer", "The systems, when switched on", "Nobody, above 65 km/h"]
  answer: 0
  explain: Assistance systems only work in certain conditions – many only above or below certain speeds. **You** are always responsible for driving the car safely.
  src: [tv-vehicle-safety, "tf|3:14"]

- id: ss-ncap
  area: vehicle
  lesson: safety-systems-car
  paths: [car-manual, car-automatic]
  q: What did research cited by Trafikverket find about cars with 5 stars in Euro NCAP's tests?
  options:
    - The risk of serious and fatal injury in car-to-car collisions was clearly lower than in 2-star cars
    - They have no crashes at all
    - They need no seat belts
    - They are only safer for pedestrians
  answer: 0
  explain: The risk of serious and fatal injury in collisions between cars was clearly **lower in 5-star cars** than in 2-star cars. Using a safe car is part of Trafikverket's basic safety advice.
  src: [tv-vehicle-safety, tv-car-safety]

