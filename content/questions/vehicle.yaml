    - Yes, always
    - Yes, in daylight
    - Yes, if you also sound the horn
  answer: 0
  explain: Bright and fluorescent gear and dipped headlights make you more conspicuous, but other drivers **may still not have seen you** or judged your distance or speed correctly – especially at **junctions**.
  src: ["uk-hc-mc|rule 86", "tsfs-2011-19|3:2"]

- id: mcv-dark
  area: vehicle
  lesson: mc-protective-gear
  paths: [motorcycle]
  q: What helps other road users see you on a motorcycle in the dark?
  options: ["Reflective clothing or strips", "Black clothing", "A tinted visor", "Riding close behind cars"]
  answer: 0
  explain: "**Reflective** clothing or strips reflect light from other vehicles' headlamps, so you are seen from further away."
  src: ["uk-hc-mc|rule 87"]

- id: mcv-gear
  area: vehicle
  lesson: mc-protective-gear
  paths: [motorcycle]
  q: Which gear may help protect you in a motorcycle crash?
  options: ["Strong boots, gloves and protective clothing", "Trainers and a T-shirt", "Shorts in summer", "Sunglasses instead of a visor"]
  answer: 0
  explain: Strong **boots, gloves** and suitable **protective clothing** may help protect you in a collision. Trafikverket lists helmet and other protective equipment among the key safety measures for riders.
  src: ["uk-hc-mc|rule 84", tv-mc-safety]

- id: mcv-abs-rule
  area: vehicle
  lesson: mc-braking
  paths: [motorcycle]
  q: Which new motorcycles must have ABS under EU rules?
  options: ["Motorcycles over 125 cc", "All motorcycles, including 50 cc", "Only motorcycles over 1,000 cc", "None – ABS is optional"]
  answer: 0
  explain: New motorcycles **over 125 cc** must have ABS. For smaller ones the manufacturer may choose between ABS and a combined brake system.
  src: [eu-168-2013]

- id: mcv-abs-measure
  area: vehicle
  lesson: mc-braking
  paths: [motorcycle]
  q: Which vehicle technology does Trafikverket name among the most important safety measures for motorcycles?
  options: ["ABS – also on light motorcycles – and cornering ABS", "Loud exhausts", "Larger fuel tanks", "Wider handlebars"]
  answer: 0
  explain: Trafikverket lists **ABS (also for light motorcycles)**, **cornering ABS**, speed-warning systems and better crash safety among the measures for motorcycles.
  src: [tv-mc-safety]

- id: mcv-both-brakes
  area: vehicle
  lesson: mc-braking
  paths: [motorcycle]
  q: How must you brake in the braking part of the motorcycle riding test?
  options: ["Efficiently and controlled, with both the front and the rear brake", "Only with the rear brake", "Only with the front brake", "With engine braking only"]
  answer: 0
  explain: The test ends with efficient, controlled braking to a stop from **70 km/h and 90 km/h**, using **both** the front and the rear brake.
  src: [tv-mc]

- id: mcv-lock
  area: vehicle
  lesson: mc-braking
  paths: [motorcycle]
  q: Why should you avoid locking the wheels when you brake hard?
  options: ["Locked wheels can lead to loss of control", "It damages the chain", "It is forbidden", "It turns the lights off"]
  answer: 0
  explain: In an emergency, brake at once – but avoid braking so harshly that you **lock the wheels**, because locked wheels can lead to loss of control. On a motorcycle, a locked front wheel almost always means a fall.
  src: ["uk-hc-general|rule 118"]

- id: mcv-auto-lights
  area: vehicle
  lesson: mc-controls
  paths: [motorcycle]
  q: What do EU rules require for the headlights of new models of motorcycles?
  options: ["That they switch on automatically", "That they are yellow", "That they can be switched off in daylight", "Nothing"]
  answer: 0
  explain: New models of motorcycles and mopeds must have **lights that switch on automatically**, to increase visibility.
  src: [eu-168-2013]

- id: mcv-kill
