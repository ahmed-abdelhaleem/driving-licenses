# ---------------------------------------------------------------- manual gearbox
- id: mg-coasting
  area: vehicle
  lesson: manual-gearbox
  paths: [car-manual]
  q: Why should you not drive downhill with the gear in neutral or the clutch pressed down (coasting)?
  options:
    - There is no engine braking, the speed rises quickly and you lose control
    - It damages the gearbox immediately
    - It is forbidden on all roads
    - It uses more electricity
  answer: 0
  explain: Coasting **removes engine braking**, makes the speed downhill increase quickly, makes you use the footbrake more (which can reduce its effect), affects steering in bends, and makes it harder to select the right gear when needed.
  src: ["uk-hc-general|rule 122"]

- id: mg-licence
  area: vehicle
  lesson: manual-gearbox
  paths: [car-manual]
  q: You pass the driving test in a manual car. Which cars may you drive?
  options: ["Both manual and automatic cars", "Only manual cars", "Only cars with five gears", "Automatic cars only after one year"]
  answer: 0
  explain: A licence from a test in a manual car lets you drive **both** manual and automatic cars. A test in an automatic car gives code 78.
  src: [tv-theory-b]

# ---------------------------------------------------------------- car controls and checks
- id: cc-lane-change
  area: vehicle
  lesson: car-controls
  paths: [car-manual, car-automatic]
  q: What should you do before changing lanes?
  options:
    - Use the mirrors and, if necessary, take a quick glance over your shoulder into the blind spot
    - Signal and move over at once
    - Only look in the inside mirror
    - Sound the horn
  answer: 0
