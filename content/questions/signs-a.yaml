# ---------------------------------------------------------------- priority signs
- id: ps-giveway-meaning
  area: rules
  lesson: priority-signs
  q: What does the duty to give way (*väjningsplikt*) require of you?
  options:
    - Show it early by slowing down or stopping, and only drive on if you cause no danger or obstruction
    - Always stop completely
    - Sound the horn and drive on carefully
    - Drive on if you are faster than the others
  answer: 0
  explain: A driver who must give way must **clearly show it in good time** by slowing down or stopping, and may continue only if it causes **no danger or obstruction** – nobody should need to brake or swerve because of you.
  src: ["tf|3:5"]

