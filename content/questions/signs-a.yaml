# ---------------------------------------------------------------- how signs work
- id: sb-shape-warning
  area: rules
  lesson: signs-basics
  q: A sign is a **triangle with the point up**, yellow with a red border. What kind of sign is it?
  options: ["A warning sign", "A prohibitory sign", "A mandatory sign", "An information sign"]
  answer: 0
  explain: Warning signs (group A) are almost all yellow triangles with a red border and the point up. They warn of a danger ahead – they do not forbid anything by themselves.
  src: ["vmf|2:4", "vmf|2:1"]

- id: sb-shape-mandatory
  area: rules
  lesson: signs-basics
  q: A **round blue** sign with a white symbol is …
  options: ["a mandatory sign – it tells you what you must do", "a prohibitory sign – it tells you what you may not do", "a warning sign", "a recommendation you may ignore"]
  answer: 0
  explain: Mandatory signs (*påbudsmärken*, group D) are round and blue with white symbols. Prohibitory signs are round with a **red** edge.
  src: ["vmf|2:9", "vmf|2:10"]

- id: sb-prohibition-end
  area: rules
  lesson: signs-basics
  q: Where does a prohibition shown by a prohibitory sign normally end?
  options:
    - At the next junction – unless an end sign or a panel shows something else
    - After exactly one kilometre
    - At the next built-up area
    - Only at an end sign
  answer: 0
  explain: A prohibitory sign applies from the sign **to the next junction**, or to an earlier end sign or a matching sign with a downward-arrow panel (T11). Some signs have their own rules, for example speed limits and no overtaking.
  src: ["vmf|2:7"]

- id: sb-exit-not-junction
  area: rules
  lesson: signs-basics
  q: You pass a "no stopping" sign and then the exit from a petrol station. Does the ban end at the exit?
  options:
    - No – exits from petrol stations, car parks and properties do not count as junctions
    - Yes – every road that joins ends the ban
    - Yes, but only on the left side of the road
    - Only if there is a give-way sign at the exit
  answer: 0
  explain: Exits from car parks, petrol stations, properties, small tracks and similar places are **not** junctions for this purpose, so the prohibition continues.
  src: ["vmf|2:7", "tf|3:21"]

- id: sb-speed-end
  area: rules
  lesson: signs-basics
  image: sign:C31-5
  q: How long does this speed limit apply?
  options:
    - Until a new speed limit, an end-of-temporary-limit sign, a pedestrian street or a walking-speed area
    - Until the next junction
    - For one kilometre
    - Until the next built-up area sign
  answer: 0
  explain: Unlike most prohibitory signs, **C31 does not end at a junction**. It applies until a different speed limit, **C32**, **E7** (pedestrian street) or **E9** (walking-speed area).
  src: ["vmf|2:8"]

- id: sb-overhead-lane
  area: rules
  lesson: signs-basics
  q: A prohibitory sign hangs **over the left lane** of a motorway. Who does it apply to?
  options: ["Only the drivers in the left lane", "All lanes", "Only heavy trucks", "Only the right lane"]
  answer: 0
  explain: Prohibitory and mandatory signs placed over the carriageway apply only to the **lane they are placed over**. A speed limit sign (C31) also covers the shoulder next to that lane.
  src: ["vmf|2:3"]

- id: sb-police-first
  area: rules
  lesson: signs-basics
  q: The traffic light shows red, but a police officer waves you on. What do you do?
  options: ["Drive on – the police officer's direction comes first", "Wait for green", "Drive on only if the junction is empty", "Turn around"]
  answer: 0
  explain: A police officer's directions apply **before** traffic signals, signs, markings and the traffic rules.
  src: ["tf|2:3"]

- id: sb-light-before-sign
  area: rules
  lesson: signs-basics
  q: At a junction there is both a working traffic light (steady light) and a give-way sign. Which do you follow?
  options: ["The traffic light", "The give-way sign", "The right-hand rule", "Whichever is nearer"]
  answer: 0
  explain: A steady light in a traffic signal applies **before** a stop or give-way sign. The signs apply when the signal is switched off or only flashes yellow.
  src: ["tf|2:2"]

- id: sb-light-off
  area: rules
  lesson: signs-basics
  q: The traffic lights at a junction only flash yellow. What applies?
  options:
    - The road signs and the general traffic rules – take special care
    - Everyone must stop
    - The main road always has priority
    - Treat it as green
  answer: 0
  explain: Flashing yellow means the signal is out of order or temporarily not working. Then the **signs** at the junction – and otherwise the general rules such as the right-hand rule – apply.
  src: ["tf|2:2", "vmf|3:6"]

- id: sb-sign-before-rule
  area: rules
  lesson: signs-basics
  q: In a built-up area there is a 40 km/h sign. What is the speed limit?
  options: ["40 km/h – the sign applies before the general rule", "50 km/h – the general rule for built-up areas", "30 km/h", "60 km/h"]
  answer: 0
  explain: If a sign differs from a general traffic rule, the **sign applies before the rule**. The general limit of 50 km/h in built-up areas is replaced by the 40 km/h sign.
  src: ["tf|2:2", "tf|3:17"]

- id: sb-with-e5
  area: rules
  lesson: signs-basics
  q: A prohibitory sign is put up **together with the built-up area sign** (E5). Where does the prohibition apply?
  options: ["In the whole built-up area", "Until the next junction", "Only on the main road", "For one kilometre"]
  answer: 0
  explain: A prohibitory sign placed together with **E5** applies in the **whole built-up area**, unless something else is shown for a certain road.
  src: ["vmf|2:7"]

- id: sb-pushing-bike
  area: rules
  lesson: signs-basics
  q: Does a "no vehicles" sign apply to someone **walking beside** a bicycle?
  options: ["No – they count as a pedestrian, unless a panel says otherwise", "Yes, always", "Only at night", "Only for electric bicycles"]
  answer: 0
  explain: A person who walks with a bicycle or moped counts as a **pedestrian**, so a ban aimed at vehicles does not apply to them – unless a panel says so.
  src: ["vmf|2:7", "tf|1:4"]

- id: sb-panels-several
  area: rules
  lesson: signs-basics
  q: Under a sign there are **two separate panels**. How do you read them?
  options:
    - Each panel adds its own condition to the sign
    - Only the lower panel applies
    - Only the upper panel applies
    - The panels cancel each other out
  answer: 0
  explain: With several panels, each one applies as a **separate addition** to the sign. If **one** panel holds several instructions, they apply **together**.
  src: ["vmf|2:2"]

# ---------------------------------------------------------------- warning signs
- id: ws-distance-50
  area: rules
  lesson: warning-signs
  q: On a road with a speed limit of 50 km/h, how far before the danger does a warning sign normally stand?
  options: ["5–75 metres", "150–250 metres", "200–400 metres", "Exactly 100 metres"]
  answer: 0
  explain: Where the limit is **50 km/h or lower**, warning signs stand **5–75 m** before the danger. At 60–70 km/h it is 50–200 m, at 80–90 km/h 150–250 m, and above 90 km/h 200–400 m.
  src: ["tsfs-2019-74|2:2"]

- id: ws-distance-90
  area: rules
  lesson: warning-signs
  q: On a road with a speed limit of 90 km/h, how far before the danger does a warning sign normally stand?
  options: ["150–250 metres", "5–75 metres", "50–100 metres", "500–1,000 metres"]
  answer: 0
  explain: At **80 or 90 km/h** a warning sign stands **150–250 m** before the danger. If it has to stand further away, a distance panel (T2) shows the distance.
  src: ["tsfs-2019-74|2:2"]

- id: ws-no-sign
  area: rules
  lesson: warning-signs
  q: On a road with the base speed of 70 km/h you see **no warning sign** before a bend. What can you conclude?
  options:
    - Nothing – warning signs are only used for dangers you cannot be expected to foresee
    - That the bend can be taken at 70 km/h
    - That there are no junctions or animals ahead
    - That the road is never icy
  answer: 0
  explain: On roads with the base speed, warning signs may only be used for things road users **cannot be expected to foresee**. Ordinary bends, visible junctions and winter ice are often not signed – you must always adapt your speed to what you see.
  src: ["tsfs-2019-74|2:1", "tf|3:14"]

- id: ws-a10-winter
  area: rules
  lesson: warning-signs
  image: sign:A10
  q: In winter you drive a long stretch without seeing this sign. Can the road still be icy?
  options:
