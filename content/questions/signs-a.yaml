    - Only if the temperature is below −10 °C
    - Only on bridges
  answer: 0
  explain: Sign **A10 (slippery road)** is used to warn of snow or ice **only if there are special reasons**. In winter you must judge the grip yourself.
  src: ["vmf|2:5"]

- id: ws-a3-percent
  area: rules
  lesson: warning-signs
  image: sign:A3
  q: The sign shows 10 %. What does that mean?
  options:
    - The road drops 10 metres for every 100 metres
