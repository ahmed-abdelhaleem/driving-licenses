  area: rules
  lesson: priority-signs
  image: sign:B2
  q: You come to this sign and can see that the crossing road is completely empty. What must you do?
  options: ["Stop completely, then drive on", "Slow down and drive on without stopping", "Stop only if a vehicle is coming", "Sound the horn and drive on"]
  answer: 0
  explain: "**Stop means stop** – you must stop completely before entering the crossing road, even if it is empty, and then give way."
  src: ["vmf|2:6", "tf|3:19"]

- id: ps-stop-where
