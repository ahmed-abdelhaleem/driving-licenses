  answer: 0
  explain: Stop **at the stop line**. If there is none, stop **immediately before entering** the crossing road, route or track area.
  src: ["tf|3:19"]

- id: ps-stop-view
  area: rules
  lesson: priority-signs
  q: You have stopped at the stop line, but buildings hide the crossing road. What do you do?
