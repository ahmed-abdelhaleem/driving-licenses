H4: { en: Gas for vehicles, text: "Marks places that sell different kinds of vehicle gas. The abbreviation shows the type; CNG means compressed natural gas.", variants: { H4-2: "LPG – liquefied petroleum gas", H4-3: "LNG – liquefied natural gas", H4-4: "H2 – hydrogen" }, kw: [CNG, LPG, LNG, hydrogen, biogas], lesson: environment-and-vehicles }
H5: { en: Café, text: "Marks a place serving drinks and simple meals.", kw: [snacks, coffee, servering], lesson: direction-signs }
H6: { en: Restaurant, text: "Marks a restaurant.", kw: [food, dining], lesson: direction-signs }
H7: { en: Hotel, text: "Marks a hotel.", kw: [accommodation], lesson: direction-signs }
H8: { en: Hostel, text: "Marks a hostel (vandrarhem).", kw: [youth hostel], lesson: direction-signs }
H9: { en: Holiday cabin village, text: "Marks a place with a larger number of cabins.", kw: [cabins, stugby], lesson: direction-signs }
H10: { en: Holiday cabins, text: "Marks a place with a few cabins.", kw: [cabin, stuga], lesson: direction-signs }
H11: { en: Campsite, text: "Marks a site with places for both tents and vehicles with living accommodation (caravans and motorhomes).", kw: [camping, tents], lesson: direction-signs }
H12: { en: Caravan site, text: "Marks a site with places only for vehicles with living accommodation.", kw: [caravans, motorhomes], lesson: direction-signs }
H13: { en: Rest area, text: "Marks a rest area with a toilet that can also be used by people with reduced mobility.", kw: [lay-by, rastplats, picnic], lesson: direction-signs }
H14: { en: Toilet, text: "Marks a toilet that can also be used by people with reduced mobility.", kw: [WC, restroom], lesson: direction-signs }
H15: { en: Bathing place, text: "Marks a beach or other bathing facility.", kw: [beach, swimming], lesson: direction-signs }
H16: { en: Outdoor recreation area, text: "Marks an outdoor recreation area.", kw: [nature, park], lesson: direction-signs }
H17: { en: Hiking trail, text: "Marks a hiking trail.", kw: [walking trail], lesson: direction-signs }
H18: { en: Chair lift, text: "Marks a lift with chairs or similar.", kw: [ski lift], lesson: direction-signs }
H19: { en: Ski tow, text: "Marks a lift where skiers are pulled along.", kw: [drag lift, T-bar], lesson: direction-signs }
H20: { en: Golf course, text: "Marks a golf course.", kw: [golf], lesson: direction-signs }
H21: { en: Fishing licences sold here, text: "Marks a place that sells fishing licences.", kw: [fishing permit, fiskekort], lesson: direction-signs }
H22: { en: Place of interest, text: "Marks a sight of national interest. The kind of sight is shown next to the sign.", kw: [sight, attraction, sevärdhet], lesson: direction-signs }
H23: { en: Services ahead, text: "Gives advance information about services near the road, sometimes with their names, and the distance to the exit or junction. Fuel, restaurant and hotel symbols may be completed with company names or emblems.", kw: [motorway services, roadside services], lesson: direction-signs }
H24: { en: Bed and breakfast, text: "Marks a place offering rooms for the night and breakfast.", kw: [B&B], lesson: direction-signs }
H25: { en: Farm shop, text: "Marks a shop selling locally made or locally grown products.", kw: [farm shop, gårdsbutik], lesson: direction-signs }
H26: { en: Crafts, text: "Marks a place where handicrafts are made and sold.", kw: [handicraft], lesson: direction-signs }
H27: { en: Charging station, text: "Marks a place for charging electric vehicles.", kw: [EV charging, laddstation, electric car], lesson: environment-and-vehicles }
H28: { en: Motorhome site, text: "Marks a site with places only for cars with living accommodation (motorhomes).", kw: [motorhome, camper van, husbil], lesson: direction-signs }

# ---------------------------------------------------------------- I: tourist signs (brown)
I1: { en: Tourist route, text: "Marks a road or route of tourist interest. It can be part of a direction sign.", kw: [scenic route, turistväg, brown sign], lesson: direction-signs }
I2: { en: Tourist area, text: "Marks a tourist area. The symbol matches the area's theme.", kw: [tourist region, brown sign], lesson: direction-signs }
I3: { en: Landmark, text: "Tells you about a landmark of tourist interest that can be seen from the road. The symbol is a silhouette of the place.", kw: [landmark, view], lesson: direction-signs }
I4: { en: World Heritage Site, text: "Marks a World Heritage Site decided by UNESCO.", kw: [UNESCO, world heritage, världsarv], lesson: direction-signs }

# ---------------------------------------------------------------- J: notice signs
J2:
  en: Information sign
  text: Gives information that matters for traffic flow or safety and that cannot be given in another way – for example that road salting ends. Warning or prohibitory signs and road numbers can be shown in it as advance information.
  kw: [yellow information sign, notice, vägsaltning upphör]
  lesson: direction-signs
J3:
  en: Dangerous overhead power line
  text: Warns that there is an electric line over the road or route that can be dangerous (livsfarlig ledning means "deadly line").
  variants: { J3-2: "A smaller version of the same sign" }
  kw: [power line, high voltage, electricity, livsfarlig ledning]
  lesson: direction-signs

# ---------------------------------------------------------------- T: additional panels
# Colour rule (VMF 2:29): a panel has the same colours as the sign above it, except
# under no-parking and no-stopping signs, where it is yellow with black text.
T1:
  en: Length of stretch
  text: Shows where a stretch begins and ends, measured from the sign. For example "200–800 m" means the sign above applies from 200 metres ahead to 800 metres ahead; "0–1.2 km" means it applies from here for 1.2 kilometres.
  kw: [stretch length, distance range]
  related: [T2]
  lesson: additional-panels
T2:
  en: Distance
  text: Shows the distance to what the sign above refers to – for example to a danger, a ban or a give-way point.
  kw: [distance ahead, meters]
  related: [T1, T3]
  lesson: additional-panels
T3:
  en: Distance to stop sign
  text: Used only under sign B1 (give way). It warns that there is a stop sign (stopplikt) at the distance shown.
  tip: When you see this panel, be ready to stop completely at the junction ahead.
  kw: [stop ahead, STOPP 200 m]
  related: [B1, B2, T2]
  lesson: priority-signs
T4:
  en: Free width
  text: Shows the free width of the road, for example where the road narrows.
  kw: [width, road width]
  lesson: additional-panels
T5:
  en: Total weight
  text: The sign above applies only to vehicles with a total weight (the highest weight the vehicle is registered for) above the value shown.
  tip: Total weight is the registered maximum weight, not what the vehicle weighs today. A light truck with a total weight of 3.5 t is not covered by a ban for vehicles over 3.5 t.
  kw: [weight, tonnes, totalvikt]
  related: [C20]
  lesson: additional-panels
T6:
  en: Times
  text: "Shows when the sign above applies. Black or white numbers without brackets mean weekdays except the day before a Sunday or public holiday. Numbers in brackets mean the day before a Sunday or public holiday (usually Saturday). Red numbers mean Sundays and public holidays. If a period runs past midnight, the part after midnight belongs to the next day. If a particular date or weekday is given, the rule applies that day whatever kind of day it is."
  tip: "Example: 8–17, (8–14), 8–13 in red means Monday–Friday 8–17, Saturday 8–14, Sunday and holidays 8–13."
  kw: [time panel, hours, weekdays, Saturday, Sunday, red numbers, brackets]
  lesson: additional-panels
T7:
  en: Disabled parking permit
  text: Used only under sign E19 (parking). The parking applies to people who may park with a parking permit for people with disabilities. Times on panel T6 work as usual.
  kw: [disabled parking, handicap parking, wheelchair]
  related: [E19, T8]
  lesson: stopping-and-parking
T8:
  en: Vehicle type or road user panel
  text: The sign above applies only to the vehicle type or road user group shown by the symbol. Times on panel T6 work as usual.
  tip: For example, sign C27 (no overtaking) with a truck panel applies only to heavy trucks; a P sign with a car panel means parking only for cars.
  variants:
    T8-2: Heavy trucks with a trailer
    T8-3: Passenger cars
    T8-4: Passenger cars with a light trailer
    T8-5: Buses
    T8-6: Tractors and class II motor implements
    T8-7: Motorcycles and class I mopeds (two-wheeled, without sidecar)
    T8-8: Bicycles and class II mopeds
    T8-9: Light trailers (släpkärra)
    T8-10: Pedestrians
    T8-11: People with reduced mobility
  kw: [vehicle symbol, applies only to, truck panel]
  lesson: additional-panels
T9:
  en: People with impaired sight
  text: Shows that people with impaired sight are often found here.
  kw: [blind people, visually impaired]
  related: [T10]
  lesson: additional-panels
T10:
  en: People with impaired hearing
  text: Shows that people with impaired hearing are often found here. This panel is always yellow.
  kw: [deaf people, hearing impaired]
  related: [T9]
  lesson: additional-panels
T11:
  en: Extent
  text: A panel with arrows pointing both ways (horizontal or vertical) means the rule applies on both sides of the sign. An arrow pointing down means the rule ends here. An arrow to the right or left shows that the rule applies in that direction. Under a parking sign (E19) it has black arrows on white without a border.
  variants:
    T11-2: Rule ends here (arrow pointing down)
    T11-3: Rule applies in the direction of the arrow
    T11-4: Rule applies to the left (under a parking sign)
    T11-5: Rule applies to the right (under a parking sign)
    T11-6: Rule applies on both sides (yellow, under a no-parking sign)
    T11-7: Rule applies on both sides (vertical, yellow)
    T11-8: Rule ends here (yellow, under a no-parking sign)
    T11-9: Rule applies to the left (yellow)
    T11-10: Rule applies to the right (yellow)
  kw: [arrow panel, ends here, both sides, utsträckning]
  lesson: additional-panels
T12:
  en: Direction
  text: Shows the direction to what the sign above refers to.
  variants:
    T12-2: Direction (half right)
    T12-3: Direction (straight ahead)
    T12-4: Direction (half left)
    T12-5: Direction (left)
    T12-6: Direction (to the left)
    T12-7: Direction (to the right)
    T12-8: Direction (both ways)
    T12-9: Direction (straight ahead and left)
    T12-10: Direction (straight ahead and right)
    T12-11: Direction (diagonally right)
  kw: [direction arrow]
  lesson: additional-panels
T13:
  en: All-way give way
  text: Shows that drivers on every road into the junction have to give way.
  tip: When everyone has to give way, the right-hand rule decides between drivers who arrive at the same time.
  kw: [all-way yield, flervägsväjning]
  related: [T14, B1]
  lesson: priority-signs
T14:
  en: All-way stop
  text: Shows that drivers on every road into the junction must stop.
  tip: After stopping, the right-hand rule decides who goes first if several drivers arrive at the same time.
  kw: [all-way stop, four-way stop, flervägsstopp]
  related: [T13, B2]
  lesson: priority-signs
T15:
  en: How the roads continue in the junction
  text: Shows a junction where drivers on the road drawn with a narrow line must give way to vehicles on the road drawn with a wide line. The symbol is drawn to match the place.
  tip: This panel is common under a main road sign where the main road turns. The wide line shows where the priority road goes.
  variants:
    T15-2: Another junction layout
    T15-3: Another junction layout
    T15-4: Another junction layout
    T15-5: Another junction layout
    T15-6: Another junction layout
  kw: [priority road turns, main road bends]
  related: [B4, B1]
  lesson: priority-signs
T16:
  en: Fee
  text: Parking costs money according to the price list on the parking meter, ticket machine or similar, and any other conditions written there must be followed. Times on panel T6 work as usual.
  kw: [paid parking, avgift, parking meter]
  related: [E19, T20]
  lesson: stopping-and-parking
T17:
  en: Parking disc
  text: You must show the time you started parking with a parking disc (P-skiva) or similar. Times on panel T6 work as usual.
  tip: Set the disc to the next half hour after you arrive. Arrive at 10:10 and you set 10:30.
  kw: [parking disc, P-skiva, parkeringsskiva]
  related: [T18]
  lesson: stopping-and-parking
T18:
  en: Time limit for parking
  text: Shows the longest time you may park. Times on panel T6 work as usual.
  kw: [max parking time, 2 tim, hours]
  related: [T17]
  lesson: stopping-and-parking
T19:
  en: Residents
  text: Residents of an area who have a special permit may park under special conditions. An area code may be added. Times on panel T6 work as usual.
  kw: [resident parking, boende]
  lesson: stopping-and-parking
T20:
  en: Parking ticket
  text: Parking is free of charge, but you must use a parking ticket. Times on panel T6 work as usual.
  kw: [free ticket, P-biljett]
  related: [T16]
  lesson: stopping-and-parking
T21:
  en: How to park
  text: Shows how vehicles must be placed in a car park – for example at right angles, in a line, or at an angle. The panel is drawn to match the place.
  variants: { T21-2: Park in a line along the road, T21-3: Park at an angle, T21-4: Park at an angle (other direction) }
  kw: [parking layout, angle parking]
  lesson: stopping-and-parking
T22:
  en: Text panel
  text: Gives an extra instruction in words that no other panel, or combination of panels, can give. Times on panel T6 work as usual.
  kw: [text, written panel]
  lesson: additional-panels
T23:
  en: Tunnel category
  text: Used under sign C9 (no vehicles with dangerous goods). The letter B, C, D or E gives the tunnel's category, which decides which dangerous goods are banned. Times may be shown.
  variants: { T23-2: Tunnel category C, T23-3: Tunnel category D, T23-4: Tunnel category E }
  kw: [tunnel category, dangerous goods]
  related: [C9]
  lesson: additional-panels
  quiz: false
T24:
  en: Charging place
  text: Used under sign E19 (parking). It marks a place for charging electric vehicles, where only vehicles that can be charged from an external source may park.
  tip: A petrol or diesel car may not park here, not even for a short time; it may only stop to let people get in or out.
  kw: [EV charging, electric car parking, laddplats]
  related: [E19, H27]
  lesson: stopping-and-parking
T25:
  en: Open 24 hours
  text: Shows that a café or restaurant is open around the clock. It is used under sign H5 or H6.
  kw: [24 hours, open all night]
  lesson: direction-signs
  quiz: false

# ---------------------------------------------------------------- S: symbols on signs and panels
S1: { en: Heavy truck, text: "Symbol for a heavy truck (total weight over 3,500 kg), used on direction signs and panels.", kw: [lorry symbol], lesson: additional-panels }
S2: { en: Heavy truck with trailer, text: "Symbol for a heavy truck with a trailer.", kw: [truck and trailer], lesson: additional-panels }
S3: { en: Passenger car, text: "Symbol for a passenger car.", kw: [car symbol], lesson: additional-panels }
S4: { en: Passenger car with light trailer, text: "Symbol for a passenger car towing a light trailer (släpkärra).", kw: [car and trailer], lesson: additional-panels }
S5: { en: Bus, text: "Symbol for a bus.", kw: [bus symbol], lesson: additional-panels }
S6: { en: Tractor and class II motor implement, text: "Symbol for tractors and class II motor implements (machines built for at most 30 km/h).", kw: [tractor symbol], lesson: additional-panels }
S7: { en: Motorcycle, text: "Symbol for a two-wheeled motorcycle without a sidecar and a two-wheeled class I moped without a sidecar.", kw: [motorbike symbol, MC], lesson: additional-panels }
S8: { en: Bicycle and class II moped, text: "Symbol for bicycles and class II mopeds.", kw: [bike symbol], lesson: additional-panels }
S9: { en: Light trailer, text: "Symbol for a light trailer of the kind called släpkärra.", kw: [trailer symbol], lesson: additional-panels }
S10: { en: Pedestrians, text: "Symbol for pedestrians.", kw: [walkers], lesson: additional-panels }
S11: { en: People with reduced mobility, text: "Symbol for people with reduced mobility.", kw: [wheelchair, disabled], lesson: additional-panels }
S12: { en: Motorhome, text: "Symbol for a class II passenger car – a car with a permanent living area (motorhome).", kw: [camper van, husbil], lesson: additional-panels }
S13: { en: Passenger ferry, text: "Symbol for a terminal for a passenger ferry, or showing that the destination can only be reached by a ferry for passengers.", kw: [foot ferry], lesson: additional-panels }

# ---------------------------------------------------------------- M: road markings (VMF chapter 4)
# Markings are white unless stated. Yellow markings used for temporary needs (road works)
# apply instead of the ordinary ones. The no-parking/no-stopping kerb markings are always yellow.
M1:
  en: Centre line or lane line
  text: A broken line. As a centre line it marks the border between lanes for traffic in opposite directions; as a lane line it marks the border between lanes in the same direction. The dashes and gaps have the length ratio 1:3 or 1:1. A centre line can also mark the middle of a cycle track (ratio 1:1).
  tip: You may cross a broken centre line, for example to overtake, if it is safe.
  kw: [broken line, dashed line, centre line, lane marking, mittlinje]
  related: [M3, M8]
  lesson: road-markings
M2:
  en: Edge line
  text: A broken line marking the outer edge of the carriageway. Ratio 1:2 between dash and gap.
  kw: [edge marking, kantlinje, road edge]
  related: [M8]
  lesson: road-markings
M3:
  en: Warning line
  text: A broken line with long dashes and short gaps (ratio 3:1) between lanes for opposite directions. It tells you that crossing it is unsuitable because of traffic conditions, for example poor sight ahead. It can also warn of a solid line coming up.
  tip: Crossing a warning line is not forbidden, but it is a strong hint not to overtake here.
  kw: [warning line, long dashes, varningslinje]
  related: [M1, M8]
  lesson: road-markings
M4:
  en: Guide line
  text: A broken line (ratio 1:1) showing a suitable path through complicated junctions, or elsewhere where guidance is needed.
  kw: [guidance line, junction line, ledlinje]
  lesson: road-markings
M5:
  en: Cycle lane line
  text: A broken line (ratio 1:1) marking the border between a cycle lane and another lane.
  kw: [bike lane line, cykelfält]
  lesson: road-markings
M6:
  en: Bus lane line
  text: A broken line (ratio 1:1) marking the border between a lane for buses in scheduled service (and others allowed) and another lane.
  kw: [bus lane marking]
  lesson: road-markings
M7:
  en: Reversible lane line
  text: A double broken line (ratio 1:1) marking a lane that is used by traffic in one direction at some times and the other direction at other times.
  kw: [tidal flow, reversible lane]
  lesson: road-markings
M8:
  en: Solid line
  text: A solid line replaces a broken line where it is not allowed, for safety reasons, to cross over to oncoming lanes, change lanes or drive out onto the shoulder. You may not drive with any wheel over a solid line (with a few exceptions, for example to pass an obstacle or to reach a property, with special care). A solid centre line can be single or double; a solid lane line and a solid edge line are single.
  tip: A broken line running right next to a solid line on your side means you may cross from your side.
  kw: [continuous line, unbroken line, heldragen linje, no crossing]
  related: [M10, M11]
  lesson: road-markings
M9:
  en: Restricted area (hatched area)
  text: An area marked with angled or diagonal stripes and bordered by a solid line. Vehicles may not drive on it (Road Traffic Ordinance chapter 3, section 11). Part or all of the area can be painted white.
  kw: [hatched area, chevrons, spärrområde]
  lesson: road-markings
M10:
  en: Centre or lane line combined with a solid line
  text: Used where vehicles on the side of the solid line may not change lanes or cross, while vehicles on the side of the broken line may.
  kw: [double line, one side solid]
  related: [M8, M11]
  lesson: road-markings
M11:
  en: Warning line combined with a solid line
  text: Used where vehicles on the side of the solid line may not change lanes or cross, while vehicles on the warning-line side may (if it is safe).
  kw: [double line]
  related: [M10, M3]
  lesson: road-markings
M12:
  en: Centre line combined with a warning line
  text: Used where crossing the warning line is unsuitable because of the traffic conditions, while crossing from the centre-line side is less of a problem.
  kw: [double broken line]
  related: [M3]
  lesson: road-markings
M13:
  en: Stop line
  text: Marks where a vehicle must stop because of a sign, a traffic signal or a level-crossing light signal (Y1).
  kw: [stop line, wide line across the road, stopplinje]
  related: [B2, M14]
  lesson: road-markings
M14:
  en: Give-way line
  text: A row of triangles across the road ("shark's teeth") that marks the line vehicles should not pass when giving way.
  kw: [shark teeth, give way line, väjningslinje, triangles]
  related: [B1, M13]
  lesson: road-markings
M15:
  en: Pedestrian crossing marking
  text: Stripes across the road marking a pedestrian crossing. It is used where sign B3 is placed.
  kw: [zebra stripes, crosswalk]
  related: [B3]
  lesson: road-markings
M16:
  en: Cycle passage or cycle crossing marking
  text: Marks a cycle passage or a cycle crossing (where sign B8 stands). At a cycle crossing it is combined with a give-way line (M14). A pedestrian crossing marking may form one of its edges.
  tip: With shark's teeth and sign B8 it is a cycle crossing, where you must give way. Without them it is a cycle passage, where you adapt your speed so cyclists are not put in danger.
  kw: [bike crossing marking, cycle passage]
  related: [B8]
  lesson: pedestrians-and-cyclists
M17:
  en: Speed bump marking
  text: Marks a speed bump, dip or similar.
  kw: [speed hump marking]
  related: [A9]
  lesson: road-markings
M17a:
  en: Cycle box
  text: Marks a suitable waiting position for cyclists and class II moped riders, for example in front of cars at traffic lights. It is adapted to the place.
  kw: [advanced stop box, bike box, cykelbox]
  lesson: road-markings
M18:
  en: Give-way or stop ahead
  text: A triangle painted on the road warning that you will have to give way or stop further ahead.
  kw: [triangle on road, give way ahead]
  related: [B1, B2]
  lesson: road-markings
M19:
  en: Lane arrows
  text: Show the suitable lane for the next junction. If the lane is bordered by solid lane lines, drivers must follow the direction or directions of the arrows (except when entering or leaving a reserved lane near the junction). Double arrows in the same direction show the lane for the next junction and the one after. The arrows also mean you may not drive in the opposite direction.
  variants: { M19a: "Lane arrows before a roundabout" }
  kw: [arrows on road, turn lane, körfältspilar]
  lesson: turning-and-lanes
M20:
  en: Change lanes
  text: An arrow showing that you must change lane as soon as possible, because your lane ends.
  variants: { M20a: "Advance notice of a solid centre line or a physical barrier ahead" }
  kw: [lane ends arrow, merge arrow]
  lesson: turning-and-lanes
M21:
  en: No stopping or parking (yellow line)
  text: A solid yellow line at the edge of the carriageway showing that stopping and parking are prohibited.
  kw: [yellow line, kerb marking, no stopping]
  related: [C39, M22]
  lesson: stopping-and-parking
M22:
  en: No parking (yellow broken line)
  text: A broken yellow line at the edge of the carriageway showing that parking is prohibited. It is also used to show the extent of a bus stop.
  kw: [yellow dashed line, no parking]
  related: [C35, M21]
  lesson: stopping-and-parking
M23:
  en: Yellow zigzag line
  text: A yellow zigzag that reinforces markings M21 (no stopping or parking) and M22 (no parking).
  kw: [zigzag, yellow zigzag]
  related: [M21, M22]
  lesson: stopping-and-parking
M24:
  en: Parking space marking
  text: Marks the border of a space where vehicles may be placed. It can be a broken line.
  kw: [parking bay lines]
  lesson: stopping-and-parking
M25:
  en: Pedestrian and cycle arrow
  text: Shows a suitable route for pedestrians or for cyclists and class II moped riders.
  kw: [path arrow]
  lesson: road-markings
M26:
  en: Bicycle symbol
  text: Shows a track or a suitable route for cyclists and class II moped riders.
  kw: [bike symbol on road]
  lesson: road-markings
M27:
  en: Pedestrian symbol
  text: Shows a path or suitable route for pedestrians.
  kw: [walking symbol on road]
  lesson: road-markings
M28:
  en: BUSS marking
  text: Shows that the lane is meant for buses in scheduled service and others allowed there.
  kw: [bus lane text, BUSS]
  related: [D10]
  lesson: road-markings
M29:
  en: Speed limit marking
  text: Painted on the road to remind you of the speed limit.
  kw: [speed number on road, 30 painted]
  related: [C31]
  lesson: road-markings
M30:
  en: Road number marking
  text: Shows the road number painted on the road.
  kw: [E4 on road]
  lesson: road-markings
M31:
  en: Purpose place marking
  text: Shows that a parking space is meant for a certain purpose, for example LASTPLATS (loading place). The text matches the purpose.
  kw: [loading place text]
  related: [C40]
  lesson: road-markings
M32:
  en: STOPP marking
  text: The word STOPP painted on the road. Used together with sign B2 to reinforce the duty to stop.
  kw: [stop painted]
  related: [B2]
  lesson: road-markings
M33:
  en: Disabled parking marking
  text: Shows a parking space only for people with reduced mobility (with a disabled parking permit).
  kw: [wheelchair symbol, disabled bay]
  lesson: road-markings
M34:
  en: Information marking
  text: Text painted on the road that gives information, a warning or guidance that matters to road users, for example SKOLA (school).
  kw: [SKOLA, text on road]
  lesson: road-markings

# ---------------------------------------------------------------- SIG: traffic signals (VMF chapter 3)
# The SIG numbers are Transportstyrelsen's catalogue numbers; the law gives signals no codes.
SIG1:
  en: Red light
  text: Stop. Vehicles may not pass the stop line, or the signal if there is no stop line. A red arrow outline in the lamp means the red light only applies to the direction of the arrow.
  kw: [red light, stop light, rött ljus, traffic light]
  related: [SIG2, SIG4]
  lesson: signals-and-police
SIG2:
  en: Red and yellow light
  text: The light is about to turn green. Otherwise it means the same as red – you may not drive yet.
  kw: [red amber, red yellow]
  related: [SIG1, SIG3]
  lesson: signals-and-police
SIG3:
  en: Green light
  text: Vehicles may go ahead. A green arrow means the signal applies to the direction of the arrow, and you may drive in that direction even if another light is showing at the same time.
  tip: Green does not mean the way is clear. When you turn, you must still give way to pedestrians and cyclists crossing the road you turn into.
  kw: [green light, go]
  related: [SIG1]
  lesson: signals-and-police
SIG4:
  en: Yellow light
  text: Stop. Vehicles may not pass the stop line (or the signal) unless they were so close when the light changed from green to yellow that they cannot stop safely.
  kw: [amber light, yellow light, gult ljus]
  related: [SIG1, SIG5]
  lesson: signals-and-police
SIG5:
  en: Flashing yellow light
  text: Take special care when passing. It is shown only when the signals are out of order or temporarily not working for a short time; the normal priority rules and signs then apply.
  kw: [flashing amber, signals out of order]
  related: [SIG4, SIG18]
  lesson: signals-and-police
SIG6:
  en: Red pedestrian light
  text: A standing figure, often with a slow ticking sound. Pedestrians may not step onto the carriageway, cycle track or crossing. Someone already on the road when it turns red should continue to the other side, or stop on a refuge if there is one.
  kw: [red man, don't walk]
  related: [SIG7]
  lesson: signals-and-police
SIG7:
  en: Green pedestrian light
  text: A walking figure, often with a fast ticking sound. Pedestrians may cross. A flashing green figure (with a fast sound with breaks) means it will soon turn red.
  tip: As a driver turning at a junction, you must let pedestrians cross on a green pedestrian light.
  kw: [green man, walk signal]
  related: [SIG6]
  lesson: signals-and-police
SIG8:
  en: Public transport signal "S"
  text: Stop. A white S in a signal for buses and trams. It applies to vehicles in scheduled service and trams – and to everyone using a bus lane where the signal stands by that lane.
  kw: [bus signal, tram signal, kollektivtrafiksignal]
  related: [SIG9, SIG10, SIG11]
  lesson: signals-and-police
SIG9:
  en: Public transport signal "S" with a horizontal bar
  text: The signal is about to show the vertical bar (go). Otherwise it means the same as S – stop.
  kw: [bus signal]
  related: [SIG8]
  lesson: signals-and-police
SIG10:
  en: Public transport signal with a vertical bar or arrow
  text: Go. Buses and trams may continue. An arrow means it applies to that direction.
  kw: [bus signal go]
  related: [SIG8]
  lesson: signals-and-police
SIG11:
  en: Public transport signal with a horizontal bar
  text: Stop, unless the vehicle was so close when the signal changed from a vertical to a horizontal bar that it cannot stop safely. A flashing horizontal bar means take special care.
  kw: [bus signal stop]
  related: [SIG8]
  lesson: signals-and-police
SIG12:
  en: Lane signal – red cross
  text: A red cross above a lane means the lane, and the shoulder next to it, may not be used.
  tip: Common on motorways and in tunnels when a lane is closed because of an accident or road works.
  kw: [lane closed, red X, motorway gantry]
  related: [SIG13, SIG14]
  lesson: signals-and-police
SIG13:
  en: Lane signal – yellow arrow
  text: A yellow diagonal arrow (or arrows) above a lane means you must change to another lane in the direction shown.
  kw: [lane change arrow, move over]
  related: [SIG12, SIG14]
  lesson: signals-and-police
SIG14:
  en: Lane signal – green arrow
  text: A green arrow pointing down above a lane means the lane may be used. A road sign may be shown instead of the green arrow.
  kw: [lane open]
  related: [SIG12, SIG13]
  lesson: signals-and-police
SIG16:
  en: Flashing red lights (bridge, fire station, tunnel …)
  text: Two red lights flashing alternately mean stop. You may not pass the stop line, or the signal. They are used where a road is temporarily closed, for example at an opening bridge, a fire or ambulance station, an airfield, road works or a tunnel. A ringing sound may be added.
  kw: [alternating red lights, bridge signal]
  related: [Y1]
  lesson: signals-and-police
SIG17:
  en: Steady red light (road closed)
  text: A steady red light means the road is completely closed.
  kw: [road closed light]
  lesson: signals-and-police
SIG18:
  en: Flashing yellow light (take special care)
  text: Used where a road is partly closed, or to make a sign or other device easier to notice. It can also be combined with a sound to warn pedestrians of a crossing tram or bus.
  kw: [flashing amber beacon, caution light]
  related: [SIG5]
  lesson: signals-and-police

# ---------------------------------------------------------------- P: signals from police (VMF chapter 7)
P1:
  en: Police – stop (arm stretched out)
  text: Stop for road users coming from in front of or behind the police officer. It is used in junctions and applies as long as the officer faces the same way. For road users coming from the side, it means the way is clear and they may drive. It can be combined with P2 and given with a stop paddle.
  tip: Think of the officer as a closed gate facing you, and an open gate from the side.
  kw: [police officer, traffic police, arm out]
  related: [P2, P4]
  lesson: signals-and-police
P2:
  en: Police – stop (raised hand)
  text: Stop for the road user that the palm of the hand is facing. It can be given with a stop paddle.
  kw: [police hand, stop]
  related: [P1]
  lesson: signals-and-police
P3:
  en: Police – stop (lamp)
  text: Stop for the road user that the lamp is facing. Used in darkness and when visibility is poor; the lamp is held where it is easiest to see.
  kw: [police torch, red lamp]
  related: [P2]
  lesson: signals-and-police
P4:
  en: Police – drive on
  text: Road users in the direction of the officer's waving movement may continue.
  kw: [wave on, proceed]
  related: [P1]
  lesson: signals-and-police
P5:
  en: Police – slow down
  text: The road user the officer is facing must reduce speed. In darkness or poor visibility it can be made clearer with a lamp or reflector showing white or yellow light.
  kw: [slow down signal]
  related: [P8, P9]
  lesson: signals-and-police
P6:
  en: Control point
  text: Drivers must drive into the control point to be checked. If a symbol for a vehicle type is shown, only drivers of those vehicles must drive in.
  kw: [police check, inspection, kontroll]
  related: [P7]
  lesson: signals-and-police
P7:
  en: Control point ahead
  text: Advance notice of a control point.
  kw: [checkpoint ahead]
  related: [P6]
  lesson: signals-and-police
P8:
  en: Police vehicle – slow down (traffic behind)
  text: Road users behind the police vehicle must reduce speed. In darkness it can be made clearer with white or yellow light or a reflector.
  kw: [police car, slow down]
  related: [P9, P5]
  lesson: signals-and-police
P9:
  en: Police vehicle – slow down (oncoming traffic)
  text: Road users meeting the police vehicle must reduce speed. In darkness it can be made clearer with white or yellow light or a reflector.
  kw: [police car, slow down]
  related: [P8, P5]
  lesson: signals-and-police
P10:
  en: Police vehicle – follow and stop behind it
  text: The driver of the vehicle behind the police vehicle must follow it and stop when it stops. It can be given with a stop paddle.
  kw: [follow me, police car]
  related: [P11]
  lesson: signals-and-police
P11:
  en: Police vehicle – pull over and stop in front
  text: The driver of the vehicle in front of the police vehicle must pull over to the side of the road and stop. The signal is given with blue and red lights flashing alternately.
  tip: Indicate, pull over where it is safe, stop and stay in the vehicle unless told otherwise.
  kw: [pulled over, blue and red lights, police stop]
  related: [P10]
  lesson: signals-and-police

# ---------------------------------------------------------------- V: signals from a guard (VMF chapter 5)
V1:
  en: Guard – stop
  text: Stop for the road user the guard is facing. In darkness it is given with a lamp showing red light. It can also be given with sign C34 with the text VAKT (guard).
  kw: [flagman, road works guard, vakt]
  related: [V2, C34]
  lesson: signals-and-police
V2:
  en: Guard – drive on
  text: The road user may continue. Given with a waving movement in the direction of travel.
  kw: [flagman wave]
  related: [V1]
  lesson: signals-and-police
V3:
  en: Guard's identification
  text: A guard who directs traffic wears identification marking on both the front and the back.
  kw: [guard vest]
  lesson: signals-and-police
  quiz: false

# ---------------------------------------------------------------- X: other traffic devices (VMF chapter 5)
X1:
  en: Marker arrow
  text: Yellow arrow(s) showing that drivers must turn sharply in the direction of the arrow(s), for example because of a bend. The number of arrows matches the place. At road works or other temporary places it has a red background.
  kw: [chevron sign, bend marker, markeringspil]
  related: [A1]
  lesson: signals-and-police
X2:
  en: Obstacle marker board
  text: Shows that the road is narrowed by an obstacle. It can also show that a road is completely or partly closed. The number of yellow fields matches the obstacle. At road works or other temporary places it has a red background.
  kw: [barrier board, obstacle marker]
  lesson: signals-and-police
X3:
  en: Side obstacle marker
  text: Marks the edge of a road or carriageway, or separates the directions of traffic at complicated places. Vehicles must pass on the side the yellow stripes slope down towards. At road works or other temporary places it has a red background; the yellow fields may then be horizontal, and you may pass on either side.
  variants: { X3-2: "Temporary version (red and yellow) – pass on the side the stripes slope towards", X3-3: "Temporary version with horizontal stripes – pass on either side" }
  kw: [bollard marker, keep left marker, refuge marker]
  related: [D2]
  lesson: signals-and-police
X4:
  en: Exit marker
  text: Marks the split between a main carriageway and an exit that has a deceleration lane.
  kw: [gore marker, exit split]
  lesson: motorways
X5:
  en: Yellow light arrow(s)
  text: Road users must pass on the side shown by the arrow or arrows, which may be flashing.
  kw: [arrow board, flashing arrows, road works]
  lesson: signals-and-police
X6:
  en: Special warning device
  text: A triangle with a text showing that the road is restricted by a temporary obstacle or similar. The text matches the reason.
  variants:
    X6-2: KONTROLL – a check or inspection
    X6-3: POLIS – police
    X6-4: BÄRGNING – vehicle recovery (towing)
    X6-5: LASTNING – loading
    X6-6: EFTERSÖK – search (for example for an injured animal after a collision)
  kw: [warning triangle, olycka, accident, recovery]
  lesson: accidents-first-aid
X7:
  en: Road barrier
  text: Shows that a road is completely or partly closed to traffic. It may carry more devices to make it easier to see.
  kw: [barrier, road closed, vägbom]
  lesson: signals-and-police
X8:
  en: Temporary closure
  text: Shows that a direction sign's information about the way to a place, facility or similar does not apply for the time being.
  kw: [crossed-out sign, temporarily closed]
  lesson: direction-signs
  quiz: false
X9:
  en: Roundabout centre marker
  text: Marks the centre of a roundabout, around which vehicles must drive.
  kw: [roundabout marker]
  related: [D3]
  lesson: right-of-way
X10:
  en: Post marker
  text: Placed on the post of a sign or device to make it easier to notice. It usually has the same colours as the sign it sits under.
  kw: [post marking]
  lesson: signals-and-police
  quiz: false

# ---------------------------------------------------------------- Y: level crossing signals and barriers (VMF chapter 6)
Y1:
  en: Level crossing light signal
  text: Two red lights flashing alternately mean stop. Road users may not pass the stop line, or the signal if there is no stop line. Below the red lights there may be a round white light that flashes to make the crossing easier to notice.
  tip: Never drive onto a level crossing while the red lights flash, the bell rings or the barriers move – even if you cannot see a train.
  kw: [railway signal, flashing red, level crossing, train]
  related: [Y2, Y3, A39]
  lesson: railway-crossings
Y2:
  en: Level crossing bell
  text: A ringing sound means stop. Road users may not pass the stop line, or the signal.
  kw: [bell, ringing, railway]
  related: [Y1]
  lesson: railway-crossings
  quiz: false
Y3:
  en: Level crossing barrier
  text: A full or half barrier. It has at least one lamp showing flashing red light towards approaching traffic from when it starts to lower until it is fully raised. The back of the barrier may have the text "Kör genom bommen" (drive through the barrier).
  tip: If you get trapped between the barriers, drive straight out through the barrier – that is what the text on its back tells you to do.
  kw: [railway barrier, boom gate, bom]
  related: [Y1, A35]
  lesson: railway-crossings
Y4:
  en: Level crossing marker board
  text: Makes a level crossing easier to notice. It is adapted to the place and may be placed lying down.
  kw: [crossing board]
  related: [A39]
  lesson: railway-crossings
  quiz: false
