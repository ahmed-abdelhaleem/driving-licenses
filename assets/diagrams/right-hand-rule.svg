<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" role="img" aria-labelledby="right-hand-rule-t right-hand-rule-d">
  <title id="right-hand-rule-t">The right-hand rule</title>
  <desc id="right-hand-rule-d">Top view of a crossroads without signs. Car A comes from the south and car B from the east, which is on A's right. A gives way and B goes first.</desc>
  <defs>
    <marker id="right-hand-rule-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="right-hand-rule-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="right-hand-rule-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="right-hand-rule-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
<rect class="d-grass" x="0" y="0" width="420" height="440"/>
<rect class="d-asphalt" x="155.0" y="0" width="110" height="440"/>
<rect class="d-asphalt" x="0" y="165.0" width="420" height="110"/>
<line class="d-line" x1="210" y1="0" x2="210" y2="157.0" stroke-width="3" stroke-dasharray="14 28"/>
<line class="d-line" x1="210" y1="283.0" x2="210" y2="440" stroke-width="3" stroke-dasharray="14 28"/>
<line class="d-line" x1="0" y1="220" x2="147.0" y2="220" stroke-width="3" stroke-dasharray="14 28"/>
<line class="d-line" x1="273.0" y1="220" x2="420" y2="220" stroke-width="3" stroke-dasharray="14 28"/>
<path class="d-path-w" d="M 285.0 192.5 L 105.0 192.5" marker-end="url(#right-hand-rule-aw)"/>
<path class="d-path-w" d="M 237.5 283.0 L 237.5 115.0" opacity="0.45"/>
<g transform="translate(237.5 337.0) rotate(0)"><rect class="d-car-a" x="-20.0" y="-48.0" width="40" height="96" rx="8.8"/><polygon class="d-glass" points="-16.8,-21.1 16.8,-21.1 14.4,-8.6 -14.4,-8.6"/><polygon class="d-glass" points="-14.4,24.0 14.4,24.0 16.4,33.6 -16.4,33.6"/><rect class="d-car-a" x="-25.0" y="-18.2" width="6" height="7" rx="2"/><rect class="d-car-a" x="19.0" y="-18.2" width="6" height="7" rx="2"/></g><text class="d-tw-b" x="237.5" y="343.0" text-anchor="middle">A</text>
<g transform="translate(335.0 192.5) rotate(-90)"><rect class="d-car-b" x="-20.0" y="-48.0" width="40" height="96" rx="8.8"/><polygon class="d-glass" points="-16.8,-21.1 16.8,-21.1 14.4,-8.6 -14.4,-8.6"/><polygon class="d-glass" points="-14.4,24.0 14.4,24.0 16.4,33.6 -16.4,33.6"/><rect class="d-car-b" x="-25.0" y="-18.2" width="6" height="7" rx="2"/><rect class="d-car-b" x="19.0" y="-18.2" width="6" height="7" rx="2"/></g><text class="d-tw-b" x="335.0" y="198.5" text-anchor="middle">B</text>
<text class="d-tb" x="438" y="40" text-anchor="start"><tspan x="438" dy="0">No signs or signals:</tspan><tspan x="438" dy="20">the right-hand rule</tspan></text>
<circle cx="450" cy="108" r="14" class="d-num"/><text class="d-num-t" x="450" y="113.5" text-anchor="middle">1</text>
<text class="d-t" x="472" y="113" text-anchor="start"><tspan x="472" dy="0">B comes from</tspan><tspan x="472" dy="20">A's right.</tspan></text>
<circle cx="450" cy="178" r="14" class="d-num"/><text class="d-num-t" x="450" y="183.5" text-anchor="middle">2</text>
<text class="d-t" x="472" y="183" text-anchor="start"><tspan x="472" dy="0">A gives way –</tspan><tspan x="472" dy="20">B goes first.</tspan></text>
<circle cx="450" cy="248" r="14" class="d-num"/><text class="d-num-t" x="450" y="253.5" text-anchor="middle">3</text>
<text class="d-t" x="472" y="253" text-anchor="start"><tspan x="472" dy="0">It also applies to</tspan><tspan x="472" dy="20">cyclists coming</tspan><tspan x="472" dy="20">from your right.</tspan></text>
<text class="d-ts" x="438" y="350" text-anchor="start"><tspan x="438" dy="0">Signs, signals or a</tspan><tspan x="438" dy="20">police officer always</tspan><tspan x="438" dy="20">take priority over</tspan><tspan x="438" dy="20">the rule.</tspan></text>
</svg>
