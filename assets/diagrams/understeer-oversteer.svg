<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="understeer-oversteer-t understeer-oversteer-d">
  <title id="understeer-oversteer-t">Understeer and oversteer</title>
  <desc id="understeer-oversteer-d">Two panels with a left-hand bend. Left: understeer – the front wheels slide and the car runs wide, straighter than the bend. Right: oversteer – the rear wheels slide and the back of the car swings out.</desc>
  <defs>
    <marker id="understeer-oversteer-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="understeer-oversteer-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="understeer-oversteer-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="understeer-oversteer-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
<rect class="d-panel" x="10" y="10" width="300" height="420" rx="10"/>
<text class="d-tb" x="160" y="42" text-anchor="middle"><tspan x="160" dy="0">Understeer</tspan></text>
<text class="d-ts" x="160" y="66" text-anchor="middle"><tspan x="160" dy="0">The front wheels slide</tspan></text>
<path class="d-asphalt" d="M 170 370 L 170 320 A 120 120 0 0 0 50 200 L 20 200 L 20 120 L 50 120 A 200 200 0 0 1 250 320 L 250 370 Z"/>
<path class="d-path-w" d="M 210.0 360 L 210.0 320 A 160.0 160.0 0 0 0 50 160.0 L 25 160.0"/>
<path class="d-arrow-r" d="M 210.0 310 Q 220.0 200 270 160" marker-end="url(#understeer-oversteer-ar)"/>
<g transform="translate(214.0 280.0) rotate(-18)"><rect class="d-car-a" x="-15.0" y="-35.0" width="30" height="70" rx="6.6"/><polygon class="d-glass" points="-12.6,-15.4 12.6,-15.4 10.8,-6.3 -10.8,-6.3"/><polygon class="d-glass" points="-10.8,17.5 10.8,17.5 12.3,24.5 -12.3,24.5"/><rect class="d-car-a" x="-20.0" y="-13.3" width="6" height="7" rx="2"/><rect class="d-car-a" x="14.0" y="-13.3" width="6" height="7" rx="2"/></g>
<text class="d-t" x="160" y="396" text-anchor="middle"><tspan x="160" dy="0">The car goes straighter –</tspan><tspan x="160" dy="20">wider – than you steer</tspan></text>
<rect class="d-panel" x="330" y="10" width="300" height="420" rx="10"/>
<text class="d-tb" x="480" y="42" text-anchor="middle"><tspan x="480" dy="0">Oversteer</tspan></text>
<text class="d-ts" x="480" y="66" text-anchor="middle"><tspan x="480" dy="0">The rear wheels slide</tspan></text>
<path class="d-asphalt" d="M 490 370 L 490 320 A 120 120 0 0 0 370 200 L 340 200 L 340 120 L 370 120 A 200 200 0 0 1 570 320 L 570 370 Z"/>
<path class="d-path-w" d="M 530.0 360 L 530.0 320 A 160.0 160.0 0 0 0 370 160.0 L 345 160.0"/>
<g transform="translate(520.0 225.0) rotate(-75)"><rect class="d-car-a" x="-15.0" y="-35.0" width="30" height="70" rx="6.6"/><polygon class="d-glass" points="-12.6,-15.4 12.6,-15.4 10.8,-6.3 -10.8,-6.3"/><polygon class="d-glass" points="-10.8,17.5 10.8,17.5 12.3,24.5 -12.3,24.5"/><rect class="d-car-a" x="-20.0" y="-13.3" width="6" height="7" rx="2"/><rect class="d-car-a" x="14.0" y="-13.3" width="6" height="7" rx="2"/></g>
<path class="d-arrow-r" d="M 556.0 250 q 18 6 36 -2" marker-end="url(#understeer-oversteer-ar)"/>
<text class="d-t" x="480" y="396" text-anchor="middle"><tspan x="480" dy="0">The rear swings out – the car</tspan><tspan x="480" dy="20">turns more than you steer</tspan></text>
</svg>
