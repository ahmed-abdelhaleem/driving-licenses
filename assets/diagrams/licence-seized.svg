<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="licence-seized-t licence-seized-d">
  <title id="licence-seized-t">When the police take your licence</title>
  <desc id="licence-seized-d">Four steps: the police take your licence on the spot; within 48 hours it is sent to Transportstyrelsen; you get a letter and have 14 days to give your side; Transportstyrelsen decides on revocation, a warning, or giving the licence back. For some offences, such as speeding, the police may let you drive for 48 hours. A waiting period counts from the day the police took the licence.</desc>
  <defs>
    <marker id="licence-seized-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="licence-seized-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="licence-seized-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="licence-seized-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
<rect class="d-panel" x="10" y="20" width="152" height="120" rx="10"/><text class="d-tb" x="22" y="46" text-anchor="start"><tspan x="22" dy="0">On the spot</tspan></text><text class="d-t" x="22" y="70" text-anchor="start"><tspan x="22" dy="0">The police take</tspan><tspan x="22" dy="19">your licence</tspan></text>
<path class="d-arrow" d="M 164 80 L 175 80" marker-end="url(#licence-seized-ah)"/>
<rect class="d-panel" x="178" y="20" width="152" height="120" rx="10"/><text class="d-tb" x="190" y="46" text-anchor="start"><tspan x="190" dy="0">Within 48 hours</tspan></text><text class="d-t" x="190" y="70" text-anchor="start"><tspan x="190" dy="0">It is sent to</tspan><tspan x="190" dy="19">Transport-</tspan><tspan x="190" dy="19">styrelsen</tspan></text>
<path class="d-arrow" d="M 332 80 L 343 80" marker-end="url(#licence-seized-ah)"/>
<rect class="d-panel" x="346" y="20" width="152" height="120" rx="10"/><text class="d-tb" x="358" y="46" text-anchor="start"><tspan x="358" dy="0">A letter to you</tspan></text><text class="d-t" x="358" y="70" text-anchor="start"><tspan x="358" dy="0">14 days to give</tspan><tspan x="358" dy="19">your side</tspan></text>
<path class="d-arrow" d="M 500 80 L 511 80" marker-end="url(#licence-seized-ah)"/>
<rect class="d-panel" x="514" y="20" width="152" height="120" rx="10"/><text class="d-tb" x="526" y="46" text-anchor="start"><tspan x="526" dy="0">The decision</tspan></text><text class="d-t" x="526" y="70" text-anchor="start"><tspan x="526" dy="0">Revocation,</tspan><tspan x="526" dy="19">a warning, or</tspan><tspan x="526" dy="19">the licence back</tspan></text>
<line class="d-ink-s" x1="10" y1="170" x2="670" y2="170" stroke-width="1" opacity="0.4"/>
<text class="d-t" x="10" y="200" text-anchor="start"><tspan x="10" dy="0">For some offences, such as speeding, the police may let you drive for 48 hours.</tspan><tspan x="10" dy="20">After that, all driving is unlawful driving – even before the decision.</tspan></text>
<text class="d-t" x="10" y="262" text-anchor="start"><tspan x="10" dy="0">If the licence is revoked, the waiting period counts from the day the police</tspan><tspan x="10" dy="20">took it.</tspan></text>
</svg>
