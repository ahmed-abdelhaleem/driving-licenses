<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="acceleration-lane-t acceleration-lane-d">
  <title id="acceleration-lane-t">Joining a motorway from an acceleration lane</title>
  <desc id="acceleration-lane-d">Top view of a two-lane motorway with an acceleration lane on the right. A car accelerates along the acceleration lane and moves out into the motorway when there is room. A car on the motorway behind adjusts its speed.</desc>
