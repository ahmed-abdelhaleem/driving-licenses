<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="licence-steps-car-t licence-steps-car-d">
  <title id="licence-steps-car-t">The steps to a car licence</title>
  <desc id="licence-steps-car-d">Six steps: 1 learner's permit from Transportstyrelsen, 2 practise from 16, 3 risk education parts 1 and 2 before the theory test, 4 theory test at Trafikverket, 5 driving test at Trafikverket, 6 licence from 18 followed by two years of probation.</desc>
  <defs>
    <marker id="licence-steps-car-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="licence-steps-car-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="licence-steps-car-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="licence-steps-car-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
<rect class="d-panel" x="10" y="20" width="196" height="112" rx="10"/><text class="d-tb" x="24" y="46" text-anchor="start"><tspan x="24" dy="0"></tspan></text>
<circle cx="36" cy="48" r="14" class="d-num"/><text class="d-num-t" x="36" y="53.5" text-anchor="middle">1</text>
<text class="d-tb" x="58" y="54" text-anchor="start"><tspan x="58" dy="0">Learner's permit</tspan></text>
<text class="d-t" x="26" y="86" text-anchor="start"><tspan x="26" dy="0">Apply to</tspan><tspan x="26" dy="20">Transportstyrelsen</tspan></text>
<path class="d-arrow" d="M 210 76.0 L 238 76.0" marker-end="url(#licence-steps-car-ah)"/>
<rect class="d-panel" x="246" y="20" width="196" height="112" rx="10"/><text class="d-tb" x="260" y="46" text-anchor="start"><tspan x="260" dy="0"></tspan></text>
<circle cx="272" cy="48" r="14" class="d-num"/><text class="d-num-t" x="272" y="53.5" text-anchor="middle">2</text>
<text class="d-tb" x="294" y="54" text-anchor="start"><tspan x="294" dy="0">Practise</tspan></text>
<text class="d-t" x="262" y="86" text-anchor="start"><tspan x="262" dy="0">From 16 – driving school</tspan><tspan x="262" dy="20">or approved supervisor</tspan></text>
<path class="d-arrow" d="M 446 76.0 L 474 76.0" marker-end="url(#licence-steps-car-ah)"/>
<rect class="d-panel" x="482" y="20" width="196" height="112" rx="10"/><text class="d-tb" x="496" y="46" text-anchor="start"><tspan x="496" dy="0"></tspan></text>
<circle cx="508" cy="48" r="14" class="d-num"/><text class="d-num-t" x="508" y="53.5" text-anchor="middle">3</text>
<text class="d-tb" x="530" y="54" text-anchor="start"><tspan x="530" dy="0">Risk education</tspan></text>
<text class="d-t" x="498" y="86" text-anchor="start"><tspan x="498" dy="0">Parts 1 and 2 – done</tspan><tspan x="498" dy="20">before the theory test</tspan></text>
<rect class="d-panel" x="10" y="182" width="196" height="112" rx="10"/><text class="d-tb" x="24" y="208" text-anchor="start"><tspan x="24" dy="0"></tspan></text>
<circle cx="36" cy="210" r="14" class="d-num"/><text class="d-num-t" x="36" y="215.5" text-anchor="middle">4</text>
<text class="d-tb" x="58" y="216" text-anchor="start"><tspan x="58" dy="0">Theory test</tspan></text>
<text class="d-t" x="26" y="248" text-anchor="start"><tspan x="26" dy="0">At Trafikverket:</tspan><tspan x="26" dy="20">70 questions, 50 min</tspan></text>
<path class="d-arrow" d="M 210 238.0 L 238 238.0" marker-end="url(#licence-steps-car-ah)"/>
<rect class="d-panel" x="246" y="182" width="196" height="112" rx="10"/><text class="d-tb" x="260" y="208" text-anchor="start"><tspan x="260" dy="0"></tspan></text>
<circle cx="272" cy="210" r="14" class="d-num"/><text class="d-num-t" x="272" y="215.5" text-anchor="middle">5</text>
<text class="d-tb" x="294" y="216" text-anchor="start"><tspan x="294" dy="0">Driving test</tspan></text>
<text class="d-t" x="262" y="248" text-anchor="start"><tspan x="262" dy="0">At Trafikverket – in a</tspan><tspan x="262" dy="20">manual or automatic car</tspan></text>
<path class="d-arrow" d="M 446 238.0 L 474 238.0" marker-end="url(#licence-steps-car-ah)"/>
<rect class="d-panel" x="482" y="182" width="196" height="112" rx="10"/><text class="d-tb" x="496" y="208" text-anchor="start"><tspan x="496" dy="0"></tspan></text>
<circle cx="508" cy="210" r="14" class="d-num"/><text class="d-num-t" x="508" y="215.5" text-anchor="middle">6</text>
<text class="d-tb" x="530" y="216" text-anchor="start"><tspan x="530" dy="0">Licence</tspan></text>
<text class="d-t" x="498" y="248" text-anchor="start"><tspan x="498" dy="0">From 18 – then two</tspan><tspan x="498" dy="20">years of probation</tspan></text>
<path class="d-arrow" d="M 580.0 136 L 580.0 157.0 L 108.0 157.0 L 108.0 172" marker-end="url(#licence-steps-car-ah)"/>
<text class="d-ts" x="10" y="318" text-anchor="start"><tspan x="10" dy="0">Book the theory test and the driving test together, a few weeks apart.</tspan></text>
</svg>
