<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 340" role="img" aria-labelledby="mc-check-points-t mc-check-points-d">
  <title id="mc-check-points-t">What to check on a motorcycle</title>
  <desc id="mc-check-points-d">Side view of a motorcycle with ten numbered check points: lights, indicators, reflectors and horn; brakes; tyres and rims; chain, belt or shaft; stand; mirrors; steering head bearing; suspension; engine oil level; kill switch.</desc>
  <defs>
    <marker id="mc-check-points-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="mc-check-points-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="mc-check-points-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="mc-check-points-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
