<path class="d-path-w" d="M 253.7 137.4 A 98.5 98.5 0 0 0 170.7 144.7" marker-end="url(#roundabout-aw)"/>
<path class="d-path-w" d="M 312.6 263.7 A 98.5 98.5 0 0 0 305.3 180.8" marker-end="url(#roundabout-aw)"/>
<circle cx="290" cy="395" r="14" class="d-num"/><text class="d-num-t" x="290" y="400.5" text-anchor="middle">1</text>
<circle cx="214" cy="132" r="14" class="d-num"/><text class="d-num-t" x="214" y="137.5" text-anchor="middle">2</text>
<circle cx="395" cy="300" r="14" class="d-num"/><text class="d-num-t" x="395" y="305.5" text-anchor="middle">3</text>
<circle cx="468" cy="40" r="14" class="d-num"/><text class="d-num-t" x="468" y="45.5" text-anchor="middle">1</text>
<text class="d-t" x="490" y="45" text-anchor="start"><tspan x="490" dy="0">Give way to all</tspan><tspan x="490" dy="20">vehicles already in</tspan><tspan x="490" dy="20">the roundabout.</tspan></text>
<circle cx="468" cy="140" r="14" class="d-num"/><text class="d-num-t" x="468" y="145.5" text-anchor="middle">2</text>
<text class="d-t" x="490" y="145" text-anchor="start"><tspan x="490" dy="0">Drive anticlock-</tspan><tspan x="490" dy="20">wise. No signal</tspan><tspan x="490" dy="20">needed on the way in.</tspan></text>
<circle cx="468" cy="240" r="14" class="d-num"/><text class="d-num-t" x="468" y="245.5" text-anchor="middle">3</text>
<text class="d-t" x="490" y="245" text-anchor="start"><tspan x="490" dy="0">Signal right when</tspan><tspan x="490" dy="20">you leave.</tspan></text>
<text class="d-ts" x="456" y="330" text-anchor="start"><tspan x="456" dy="0">In this picture, A</tspan><tspan x="456" dy="20">waits for B, which</tspan><tspan x="456" dy="20">comes from the left</tspan><tspan x="456" dy="20">in the roundabout.</tspan></text>
</svg>
