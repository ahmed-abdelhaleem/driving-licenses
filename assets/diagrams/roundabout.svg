<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" role="img" aria-labelledby="roundabout-t roundabout-d">
  <title id="roundabout-t">Driving through a roundabout</title>
  <desc id="roundabout-d">Top view of a single-lane roundabout. Car A waits at the give-way line for car B, which is already in the roundabout. Traffic goes anticlockwise. Car C leaves at the right with its right indicator on.</desc>
  <defs>
    <marker id="roundabout-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="roundabout-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="roundabout-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="roundabout-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
<rect class="d-grass" x="0" y="0" width="440" height="460"/>
<rect class="d-asphalt" x="170.0" y="0" width="100" height="230"/>
<rect class="d-asphalt" x="170.0" y="230" width="100" height="230"/>
