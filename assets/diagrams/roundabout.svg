<circle cx="220" cy="230" r="62" fill="none" class="d-line" stroke-width="3"/>
<g transform="rotate(0 220 230)"><polygon class="d-panel-g" points="214,369 226,369 224,435 216,435"/></g>
<g transform="rotate(90 220 230)"><polygon class="d-panel-g" points="214,369 226,369 224,435 216,435"/></g>
<g transform="rotate(180 220 230)"><polygon class="d-panel-g" points="214,369 226,369 224,435 216,435"/></g>
<g transform="rotate(270 220 230)"><polygon class="d-panel-g" points="214,369 226,369 224,435 216,435"/></g>
<polygon class="d-white" points="228.0,359 235.0,359 231.5,369"/>
<polygon class="d-white" points="236.4,359 243.4,359 239.9,369"/>
<polygon class="d-white" points="244.8,359 251.8,359 248.3,369"/>
<polygon class="d-white" points="253.2,359 260.2,359 256.7,369"/>
<polygon class="d-white" points="261.6,359 268.6,359 265.1,369"/>
<g transform="translate(245.0 417.0) rotate(0)"><rect class="d-car-a" x="-17.0" y="-40.0" width="34" height="80" rx="7.5"/><polygon class="d-glass" points="-14.3,-17.6 14.3,-17.6 12.2,-7.2 -12.2,-7.2"/><polygon class="d-glass" points="-12.2,20.0 12.2,20.0 13.9,28.0 -13.9,28.0"/><rect class="d-car-a" x="-22.0" y="-15.2" width="6" height="7" rx="2"/><rect class="d-car-a" x="16.0" y="-15.2" width="6" height="7" rx="2"/></g><text class="d-tw-b" x="245.0" y="423.0" text-anchor="middle">A</text>
<g transform="translate(150.3 299.7) rotate(135)"><rect class="d-car-b" x="-17.0" y="-40.0" width="34" height="80" rx="7.5"/><polygon class="d-glass" points="-14.3,-17.6 14.3,-17.6 12.2,-7.2 -12.2,-7.2"/><polygon class="d-glass" points="-12.2,20.0 12.2,20.0 13.9,28.0 -13.9,28.0"/><rect class="d-car-b" x="-22.0" y="-15.2" width="6" height="7" rx="2"/><rect class="d-car-b" x="16.0" y="-15.2" width="6" height="7" rx="2"/></g><text class="d-tw-b" x="150.3" y="305.7" text-anchor="middle">B</text>
<g transform="translate(395.0 255.0) rotate(90)"><rect class="d-car-c" x="-17.0" y="-40.0" width="34" height="80" rx="7.5"/><polygon class="d-glass" points="-14.3,-17.6 14.3,-17.6 12.2,-7.2 -12.2,-7.2"/><polygon class="d-glass" points="-12.2,20.0 12.2,20.0 13.9,28.0 -13.9,28.0"/><rect class="d-car-c" x="-22.0" y="-15.2" width="6" height="7" rx="2"/><rect class="d-car-c" x="16.0" y="-15.2" width="6" height="7" rx="2"/><circle class="d-lamp" cx="13.0" cy="-35.0" r="5"/><circle class="d-lamp" cx="13.0" cy="35.0" r="5"/></g><text class="d-tw-b" x="395.0" y="261.0" text-anchor="middle">C</text>
