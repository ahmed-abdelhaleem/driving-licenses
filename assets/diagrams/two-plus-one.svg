<text class="d-ts" x="90" y="35" text-anchor="start"><tspan x="90" dy="0">Your direction (the lower lanes)</tspan></text>
<text class="d-t" x="20" y="284" text-anchor="start"><tspan x="20" dy="0">Two lanes in your direction:</tspan><tspan x="20" dy="20">here you can overtake.</tspan></text>
<text class="d-t" x="400" y="284" text-anchor="start"><tspan x="400" dy="0">One lane: no room to overtake.</tspan><tspan x="400" dy="20">Where two lanes become one,</tspan><tspan x="400" dy="20">adapt to each other.</tspan></text>
