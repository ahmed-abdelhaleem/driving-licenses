<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" role="img" aria-labelledby="two-plus-one-t two-plus-one-d">
  <title id="two-plus-one-t">A 2+1 road with a central barrier</title>
  <desc id="two-plus-one-d">Top view of a three-lane road with a steel cable barrier in the middle. In the left part, eastbound traffic has two lanes and a car overtakes; westbound has one lane. Further on the barrier moves over and westbound traffic gets two lanes.</desc>
  <defs>
    <marker id="two-plus-one-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="two-plus-one-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="two-plus-one-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="two-plus-one-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
