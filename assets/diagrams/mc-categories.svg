<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="mc-categories-t mc-categories-d">
  <title id="mc-categories-t">Motorcycle licence categories</title>
  <desc id="mc-categories-d">Three columns. A1 from 16: light motorcycle of at most 125 cubic centimetres, 11 kilowatts and 0.1 kilowatt per kilogram. A2 from 18: at most 35 kilowatts and 0.2 kilowatt per kilogram; a restricted motorcycle may not come from one with more than 70 kilowatts. A from 24, or from 20 after two years with A2: any motorcycle.</desc>
  <defs>
    <marker id="mc-categories-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ink"/></marker>
    <marker id="mc-categories-aw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-white"/></marker>
    <marker id="mc-categories-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-bad"/></marker>
    <marker id="mc-categories-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-ok"/></marker>
  </defs>
<rect class="d-panel" x="10" y="56" width="206" height="214" rx="10"/>
<rect class="d-car-a" x="10" y="56" width="206" height="46" rx="10"/>
<text class="d-tw-b" x="26" y="88" text-anchor="start"><tspan x="26" dy="0">Category A1</tspan></text>
<text class="d-tb" x="26" y="130" text-anchor="start"><tspan x="26" dy="0">From 16</tspan></text>
<text class="d-t" x="26" y="158" text-anchor="start"><tspan x="26" dy="0">Light motorcycle:</tspan><tspan x="26" dy="21">at most 125 cm³,</tspan><tspan x="26" dy="21">11 kW and</tspan><tspan x="26" dy="21">0.1 kW per kg</tspan></text>
<rect class="d-panel" x="232" y="38" width="206" height="232" rx="10"/>
<rect class="d-car-a" x="232" y="38" width="206" height="46" rx="10"/>
<text class="d-tw-b" x="248" y="70" text-anchor="start"><tspan x="248" dy="0">Category A2</tspan></text>
<text class="d-tb" x="248" y="112" text-anchor="start"><tspan x="248" dy="0">From 18</tspan></text>
<text class="d-t" x="248" y="140" text-anchor="start"><tspan x="248" dy="0">At most 35 kW and</tspan><tspan x="248" dy="21">0.2 kW per kg</tspan><tspan x="248" dy="21">(a restricted bike may</tspan><tspan x="248" dy="21">not come from &gt; 70 kW)</tspan></text>
<rect class="d-panel" x="454" y="20" width="206" height="250" rx="10"/>
<rect class="d-car-a" x="454" y="20" width="206" height="46" rx="10"/>
<text class="d-tw-b" x="470" y="52" text-anchor="start"><tspan x="470" dy="0">Category A</tspan></text>
<text class="d-tb" x="470" y="94" text-anchor="start"><tspan x="470" dy="0">From 24 – or 20</tspan></text>
<text class="d-t" x="470" y="122" text-anchor="start"><tspan x="470" dy="0">Any motorcycle, whatever</tspan><tspan x="470" dy="21">its size or power.</tspan><tspan x="470" dy="21">From 20 if you have</tspan><tspan x="470" dy="21">held A2 for two years</tspan></text>
<text class="d-ts" x="10" y="312" text-anchor="start"><tspan x="10" dy="0">Power is the motorcycle's net power; "per kg" means per kg of kerb weight.</tspan></text>
</svg>
